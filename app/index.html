<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pričaj bosanski</title>
<meta name="description" content="Bosnisch lernen: Grundwortschatz, Zahlen, Quiz, Karteikarten, Nachsprechen.">
<meta name="theme-color" content="#2340a8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090c16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pričaj">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: phone-first app — header, scrolling view, bottom tab bar. Flag blue + gold. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#e8ebf4; --line:#d5dae8;
  --fg:#151a2e; --muted:#5b6380; --accent:#2340a8; --accent-ink:#ffffff; --accent-soft:#e2e7f8;
  --gold:#e3a915; --gold-soft:#fbefc9; --gold-ink:#1b1500; --ok:#1d7a4f; --ok-soft:#dcf1e6; --warn:#8a5f00; --bad:#b3372f; --bad-soft:#f8e1de;
  --display:ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --track:#e3e7f1; --card-line:var(--line); --card-shadow:none;
  --t-path:#2340a8; --t-words:#0f7d70; --t-frames:#6b46c1; --t-numbers:#c2501f; --t-sounds:#c0306f; --t-listen:#a86f00; --t-quiz:#1271b0; --t-cards:#1d7a4f;
  --ring-a:#2340a8; --ring-b:#0f7d70; --tint:0%;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#090c16; --surface:#141a2d; --surface-2:#1f2742; --line:#273050;
  --fg:#e8eaf4; --muted:#9aa2c2; --accent:#8da2f5; --accent-ink:#0e1220; --accent-soft:#232c55;
  --gold:#f2c552; --gold-soft:#3a3214; --gold-ink:#1b1500; --ok:#6fd3a0; --ok-soft:#163327; --warn:#e8c066; --bad:#f08a80; --bad-soft:#3d1d1b;
  --track:#1c2339; --card-line:rgba(255,255,255,.07); --card-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.35);
  --t-path:#8da2f5; --t-words:#5fd4c4; --t-frames:#b79cf7; --t-numbers:#f59f7a; --t-sounds:#f28cb8; --t-listen:#f2c552; --t-quiz:#6cc4f5; --t-cards:#6fd3a0;
  --ring-a:#8da2f5; --ring-b:#5fd4c4; --tint:13%;
  color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.app{height:100%;max-width:720px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);min-height:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.cap{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.hdr{display:flex;align-items:center;gap:8px;padding-block:12px 10px;min-height:56px;border-bottom:1px solid var(--line)}
.hdr .ttl{flex:1;min-width:0}
.hdr h1{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.hdr h1 span{color:var(--accent)}
.hdr .sub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none;padding:0}
.ibtn svg{width:18px;height:18px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;flex:none}
.main{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding-block:16px 20px;display:grid;grid-auto-rows:max-content;gap:18px;align-content:start}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-top:1px solid var(--line);padding-top:6px;padding-bottom:max(6px, env(safe-area-inset-bottom, 0px))}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:.74rem;color:var(--muted);font-weight:600}
.tabs svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--tone, var(--accent))}
.foot{padding-bottom:env(safe-area-inset-bottom, 0px)}
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:14px;padding:14px;box-shadow:var(--card-shadow)}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface-2);color:var(--fg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.btn svg{width:17px;height:17px}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.pill svg{width:15px;height:15px}
.pill.playing{border-color:var(--gold);background:var(--gold-soft)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);max-width:100%;justify-self:start}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:.9rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.field{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px;gap:6px;min-width:0}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none;font-size:16px}
.textin{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:none;font-size:16px}
.textin:focus{border-color:var(--accent)}
select.textin{width:auto;max-width:100%}
.note{font-size:.88rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:9px 11px}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.hello h2{font-size:1.9rem;letter-spacing:-.015em}
.hello p{color:var(--muted);margin-top:2px}
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px}
.ring{overflow:visible}
.ring .track{stroke:var(--track)}
.ring .val{stroke:url(#ringG);transition:stroke-dashoffset .6s}
.ring.done .val{stroke:url(#ringGold)}
.ring.done{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.ring text{fill:var(--fg);font-family:var(--display);font-weight:700}
.ring .unit{fill:var(--muted);font-family:var(--body);font-weight:400}
.stats{display:grid;gap:4px}
.stats b{font-family:var(--display);font-size:1.15rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin-top:4px}
.week .col{display:grid;gap:4px;justify-items:center;align-self:stretch;grid-template-rows:1fr auto}
.week .slot{width:100%;max-width:26px;display:flex;align-items:flex-end;background:var(--track);border-radius:6px;overflow:hidden}
.week .slot.now{outline:2px solid var(--gold);outline-offset:2px}
.week .bar{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg, var(--ring-b), var(--ring-a))}
.week .bar.zero{background:transparent}
.week .bar.hit{background:linear-gradient(180deg, #ffd977, var(--gold))}
.week span{font-size:.72rem;color:var(--muted);font-weight:600}
.action,.scen{text-align:left;background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:14px;padding:13px;display:grid;gap:3px;align-content:start}
.action b,.scen b{font-family:var(--display);font-size:1.02rem}
.action small,.scen small{color:var(--muted);font-size:.84rem;line-height:1.3}
/* Bereichsfarben: jede Übung hat ihre Farbe (--tone), als Symbolfeld und im Dunkeln als zarter Schimmer */
.t-path{--tone:var(--t-path)}.t-words{--tone:var(--t-words)}.t-frames{--tone:var(--t-frames)}.t-numbers{--tone:var(--t-numbers)}
.t-sounds{--tone:var(--t-sounds)}.t-listen{--tone:var(--t-listen)}.t-quiz{--tone:var(--t-quiz)}.t-cards{--tone:var(--t-cards)}.t-grammar{--tone:var(--t-frames)}
.action[class*="t-"],.scen[class*="t-"]{background:linear-gradient(150deg, color-mix(in srgb, var(--tone) var(--tint), var(--surface)) 0%, var(--surface) 70%)}
.action{grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.action .txt{display:grid;gap:3px;min-width:0}
.grid2 .action{grid-template-columns:minmax(0,1fr);gap:9px;align-items:start}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--tone, var(--accent));background:var(--surface-2);background:color-mix(in srgb, var(--tone, var(--accent)) 16%, transparent)}
.ico svg{width:20px;height:20px}
.scen[class*="t-"] span{color:var(--tone)}
.scen span{font-size:.88rem;font-weight:600;color:var(--accent)}
.action .badge{justify-self:start;background:var(--gold-soft);color:var(--warn);border-radius:999px;font-size:.75rem;font-weight:600;padding:1px 8px;margin-top:3px}
.list{display:grid;gap:8px}
.li{background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow-wrap:anywhere}
.li .grow small{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.boxdots{display:inline-flex;gap:3px;margin-top:4px}
.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.boxdots i.on{background:var(--ok)}
.li .grow small.weak{color:var(--bad);font-weight:600}
.bs{font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.laut{font-size:.92rem;color:var(--accent);font-style:italic;overflow-wrap:anywhere}
.de{font-size:.95rem;color:var(--muted)}
body.hide-laut .laut, body.hide-de .de{display:none}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.chip{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;display:grid;gap:1px}
.chip b{font-weight:600}
.chip small{color:var(--muted)}
.live{font-size:.95rem;color:var(--muted);font-style:italic}
.keys{display:none;gap:6px;flex-wrap:wrap}
.answer:focus-within .keys{display:flex}
.keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;padding:6px 8px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px}
.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none;padding:0}
.send svg{width:18px;height:18px}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;position:relative;padding:0}
.mic svg{width:24px;height:24px}
.mic[data-state="listening"]{background:var(--gold);color:var(--gold-ink)}
.mic[data-state="listening"]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--gold);animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.hint{font-size:.8rem;color:var(--muted);text-align:center}
.prog{display:flex;gap:5px;width:100%}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.prog i.done{background:var(--accent)}
.prog i.cur{background:var(--gold)}
.hero{border-color:var(--accent);background:var(--accent-soft)}
.practice{display:grid;gap:12px;text-align:center;justify-items:center;padding:20px 14px}
.practice .bs{font-size:1.6rem}
/* Rückmeldung: Karte färbt sich nach dem Ergebnis (gesetzt in markFeedback) */
.practice.fb-ok{border-color:var(--ok);background:linear-gradient(180deg, var(--ok-soft), var(--surface) 65%);animation:fbIn .45s ease-out}
.practice.fb-mid{border-color:var(--gold);background:linear-gradient(180deg, var(--gold-soft), var(--surface) 65%);animation:fbIn .45s ease-out}
.practice.fb-bad{border-color:var(--bad);background:linear-gradient(180deg, var(--bad-soft), var(--surface) 65%);animation:fbShake .4s ease-out}
@keyframes fbIn{0%{transform:scale(.97)}100%{transform:none}}
@keyframes fbShake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.veil{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);width:100%}
.answer{display:grid;gap:8px;width:100%}
.diff{font-family:var(--display);font-size:1.3rem;line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center}
.diff .ok{color:var(--ok)}
.diff .near{color:var(--warn);text-decoration:underline wavy;text-underline-offset:5px}
.diff .miss{color:var(--bad);text-decoration:line-through;opacity:.8}
.score{font-family:var(--display);font-size:2.2rem;font-weight:700}
.score.good{color:var(--ok)}.score.mid{color:var(--warn)}.score.low{color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;display:grid;gap:1px;font-weight:600}
.rate button small{font-weight:400;color:var(--muted);font-size:.78rem}
.rate .r1{border-color:var(--bad)} .rate .r2{border-color:var(--gold)} .rate .r3{border-color:var(--ok)}
.sound{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.sound .glyph{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--accent);text-align:center;line-height:1.1}
.sound .ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.set{display:grid;gap:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setrow label,.setrow .lbl{flex:1;min-width:0}
.setrow small{display:block;color:var(--muted);font-size:.8rem}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:21px}
input[type=range]{accent-color:var(--accent);width:140px}
.val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:3.2em;text-align:right}
.onb{display:grid;gap:22px;padding-block:20px}
.onb h2{font-size:2.1rem;letter-spacing:-.02em}
.onb .lead{color:var(--muted);font-size:1.05rem}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 10px;font-weight:600;font-size:1.08rem;min-height:68px;overflow-wrap:anywhere;transition:border-color .15s, background .15s}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.quizhead{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.combo{color:var(--warn);font-weight:600}
.bignum{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.numgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;display:grid;text-align:center}
.numgrid b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.numgrid small{color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
details.card > summary{cursor:pointer;font-weight:600}
details.card[open] > summary{margin-bottom:10px}
/* Grammatik */
.gram{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.gram p{line-height:1.55}
.gram i{font-style:normal;font-weight:600;color:var(--tone, var(--accent))}
.gh{margin-top:8px}
.gh h3{font-size:1.12rem}
.gh small{color:var(--muted);font-size:.86rem}
.note b{color:var(--fg)}
.note.warn{border-left-color:var(--bad)}
.abc{font-family:var(--display);font-weight:600;text-align:center;letter-spacing:.14em;line-height:2}
.gtw{overflow-x:auto;background:var(--surface);border:1px solid var(--card-line);border-radius:12px;box-shadow:var(--card-shadow)}
.gt{width:100%;border-collapse:collapse;font-size:.9rem}
.gt th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:bottom}
.gt td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.gt tr:last-child td{border-bottom:0}
.gt td:first-child:not(.bsc){overflow-wrap:normal}
.gt .bsc b{font-weight:600}
.gt .bsc small{display:block;color:var(--muted);font-size:.82rem}
.gt .bsc .lab{font-size:.74rem}
.gt .say{cursor:pointer}
.li .grow small.ghint{font-size:.78rem}
.dlg{display:grid;gap:10px}
.dlg .ln{display:flex;gap:10px;align-items:center}
.dlg .who{font-family:var(--display);font-weight:700;color:var(--tone, var(--accent));width:1.2em;flex:none;align-self:flex-start}
.dlg .grow{flex:1;min-width:0}
.dlg .grow b{display:block;font-weight:600;overflow-wrap:anywhere}
.dlg .grow small{display:block;color:var(--muted);font-size:.84rem}
.gq{display:grid;gap:8px}
.gq ol{margin:0;padding-left:1.4em;list-style:lower-alpha;display:grid;gap:3px}
.gq details{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}
.gq summary{cursor:pointer;font-weight:600;color:var(--tone, var(--accent))}
.gq details ol{font-weight:600;margin-top:6px}
.gcard{display:grid;gap:4px;align-content:start}
.gcard b{font-family:var(--display)}
.gcard small{color:var(--muted);font-size:.82rem}
.ico.gno{font-family:var(--display);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.conj{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.95rem;margin-top:8px}
.conj span{color:var(--muted)}
.wrow{display:grid;gap:3px}
.wrow .ex{font-size:.9rem;color:var(--muted)}
.wrow .ex b{color:var(--fg);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;width:max-content;max-width:min(90vw,460px);text-align:center;z-index:40}
@media (prefers-color-scheme: dark){

  .tabs{background:linear-gradient(180deg, transparent, rgba(255,255,255,.015))}
}

    {p:"_ne_ steht getrennt vor dem Verb: _ne znam_ (ich weiß nicht), _ne radim_ (ich arbeite nicht). Drei wichtige Ausnahmen schreibt man zusammen: _nisam_ (ich bin nicht), _nemam_ (ich habe nicht) und _neću_ (ich will nicht, ich werde nicht)."},

    {p:"Bosnisch hat *sieben Fälle*. Sie zeigen, welche Rolle ein Wort im Satz spielt. Im Deutschen erkennt man das oft am Artikel (der Frau, die Frau), im Bosnischen an der Endung (_ženi, ženu_). Vier Fälle kennst du aus dem Deutschen. Vokativ, Instrumental und Lokativ sind neu."},

    {ex:[["Ovo je moj prijatelj.","Das ist mein Freund.","Nominativ"],["To je kuća mog prijatelja.","Das ist das Haus meines Freundes.","Genitiv"],["Pomažem prijatelju.","Ich helfe meinem Freund.","Dativ"],
      ["Vidim prijatelja.","Ich sehe meinen Freund.","Akkusativ"],["Prijatelju, dođi!","Freund, komm!","Vokativ"],["Idem s prijateljem.","Ich gehe mit einem Freund.","Instrumental"],
      ["Razgovaram o prijatelju.","Ich spreche über einen Freund.","Lokativ"]]}]},

  {id:"g08", bs:"Prijedlozi i padeži", de:"Präpositionen und Fälle", blocks:[
    {p:"Die Präposition bestimmt oft den Fall. Besonders wichtig ist der Unterschied zwischen *Bewegung zu einem Ort* (wohin?) und *Aufenthalt an einem Ort* (wo?)."},
    {p:"_u_ mit Akkusativ nennt das Ziel: _u školu_ (in die Schule). _u_ mit Lokativ nennt den Ort: _u školi_ (in der Schule). Lerne Präposition und Fall deshalb immer zusammen."},
    {t:["Präposition + Fall","Beispiel"], r:[
      ["_u_ + Akkusativ",["Idem u školu.","Ich gehe in die Schule. (wohin?)"]],["_u_ + Lokativ",["Ja sam u školi.","Ich bin in der Schule. (wo?)"]],
      ["_na_ + Akkusativ",["Idem na posao.","Ich gehe zur Arbeit."]],["_na_ + Lokativ",["Ja sam na poslu.","Ich bin bei der Arbeit."]],
      ["_iz_ + Genitiv",["Dolazim iz škole.","Ich komme aus der Schule."]],["_od_ + Genitiv",["Ovo je poklon od prijatelja.","Das ist ein Geschenk von einem Freund."]],
      ["_do_ + Genitiv",["Idem do grada.","Ich gehe bis in die Stadt."]],["_kod_ + Genitiv",["Ja sam kod ljekara.","Ich bin beim Arzt."]],
      ["_bez_ + Genitiv",["Kafa bez šećera.","Kaffee ohne Zucker."]],["_s, sa_ + Instrumental",["Idem s prijateljem.","Ich gehe mit einem Freund."]],
      ["_o_ + Lokativ",["Pričamo o filmu.","Wir sprechen über den Film."]],["_za_ + Akkusativ",["Ovo je za tebe.","Das ist für dich."]]]},
    {note:["Merke","Das deutsche „in“ ist je nach Bedeutung _u_ + Akkusativ (wohin?) oder _u_ + Lokativ (wo?)."]}]},

  {id:"g09", bs:"Pridjevi i prisvojne zamjenice", de:"Adjektive und Possessivpronomen", blocks:[
    {h:["Slaganje s imenicom","Übereinstimmung mit dem Substantiv"]},
    {p:"Das Adjektiv richtet sich nach *Geschlecht, Zahl und Fall* des Substantivs: _nov grad_, _nova knjiga_, _novo selo_. Ändert sich der Fall, ändert sich auch das Adjektiv: aus _nova knjiga_ wird _Imam novu knjigu._"},
    {t:["männlich","weiblich","sächlich"], r:[
      [["lijep grad","schöne Stadt"],["lijepa kuća","schönes Haus"],["lijepo selo","schönes Dorf"]],
      [["nov automobil","neues Auto"],["nova knjiga","neues Buch"],["novo pismo","neuer Brief"]],
      [["dobar prijatelj","guter Freund"],["dobra prijateljica","gute Freundin"],["dobro dijete","gutes Kind"]]]},
    {ex:[["Ovo je lijepa kuća.","Das ist ein schönes Haus."],["Ovo je lijepo selo.","Das ist ein schönes Dorf."],["Imam novu knjigu.","Ich habe ein neues Buch.","Akkusativ"]]},
    {h:["Poređenje","Steigerung"]},
    {p:"Der Komparativ vergleicht: _brži_ heißt „schneller“. Der Superlativ bekommt _naj-_ davor: _najbrži_ heißt „am schnellsten“. Manche Formen sind unregelmäßig, zum Beispiel _dobar, bolji, najbolji_."},
    {t:["Grundform","Komparativ","Superlativ"], r:[
      [["lijep","schön"],["ljepši","schöner"],["najljepši","am schönsten"]],[["brz","schnell"],["brži","schneller"],["najbrži","am schnellsten"]],
      [["dobar","gut"],["bolji","besser"],["najbolji","am besten"]],[["velik","groß"],["veći","größer"],["najveći","am größten"]]]},
    {h:["Prisvojne zamjenice","Possessivpronomen"]},
    {p:"Auch „mein“ hat drei Formen: _moj brat_, _moja sestra_, _moje dijete_. In der Mehrzahl und in anderen Fällen ändern sich die Formen weiter."},
    {t:["männlich, weiblich, sächlich","Deutsch"], r:[
      [["moj, moja, moje"],"mein"],[["tvoj, tvoja, tvoje"],"dein"],[["njegov, njegova, njegovo"],"sein"],[["njen, njena, njeno"],"ihr (einer Frau)"],
      [["naš, naša, naše"],"unser"],[["vaš, vaša, vaše"],"euer, Ihr"],[["njihov, njihova, njihovo"],"ihr (mehrerer)"]]}]},

  {id:"g10", bs:"Prošlo, buduće i pogodbeno vrijeme", de:"Vergangenheit, Zukunft, Konditional", blocks:[
    {h:["Perfekt – prošlo vrijeme","Vergangenheit"]},
    {p:"Die Vergangenheit baust du in drei Schritten: Person bestimmen, die Kurzform von _biti_ wählen (_sam, si, je, smo, ste, su_) und das Partizip anhängen. Das Partizip richtet sich nach *Geschlecht und Zahl des Subjekts*: _radio, radila, radili, radile_."},
    {t:["Bosnisch","Deutsch","Wer?"], r:[
      [["Ja sam radio."],"Ich habe gearbeitet.","ein Mann spricht"],[["Ja sam radila."],"Ich habe gearbeitet.","eine Frau spricht"],[["On je radio."],"Er hat gearbeitet.",""],[["Ona je radila."],"Sie hat gearbeitet.",""],
      [["Mi smo radili."],"Wir haben gearbeitet.","Männer oder gemischte Gruppe"],[["One su radile."],"Sie haben gearbeitet.","nur Frauen"]]},
    {note:["Für dich","Als Mann sagst du immer _radio sam_, _bio sam_, _učio sam_."]},
    {p:"Verneint wird beim Hilfsverb: _Nisam radio._ (Ich habe nicht gearbeitet.)"},
    {h:["Futur I – budućnost","Zukunft"]},
    {p:"Die Zukunft bildest du mit _ću, ćeš, će, ćemo, ćete, će_ und dem Infinitiv: _Ja ću raditi._ Ohne Pronomen rückt die Kurzform hinter das Verb: _Radit ću._ Verneint heißt es _Neću raditi._"},
    {t:["Person","Bosnisch","Deutsch"], r:[
      ["ja",["Ja ću učiti."],"Ich werde lernen."],["ti",["Ti ćeš učiti."],"Du wirst lernen."],["on, ona",["On će učiti."],"Er wird lernen."],
      ["mi",["Mi ćemo učiti."],"Wir werden lernen."],["vi",["Vi ćete učiti."],"Ihr werdet lernen. Sie werden lernen."],["oni, one",["Oni će učiti."],"Sie werden lernen."]]},
    {ex:[["Sutra ću raditi.","Morgen werde ich arbeiten."],["Neću kasniti.","Ich werde mich nicht verspäten."]]},
    {h:["Kondicional – bih, bi …","Konditional: würde …"]},
    {p:"Für Wünsche, Mögliches und höfliche Bitten nimmst du _bih, bi, bi, bismo, biste, bi_ und das Partizip: _Ja bih radio._ (Ich würde arbeiten.) Auch hier richtet sich das Partizip nach dem Subjekt, eine Frau sagt _Ja bih radila._"},
    {t:["Person","Form"], r:[["ja",["bih"]],["ti",["bi"]],["on, ona",["bi"]],["mi",["bismo"]],["vi",["biste"]],["oni, one",["bi"]]]},
    {ex:[["Ja bih učio bosanski.","Ich würde Bosnisch lernen."],["Bismo li mogli razgovarati?","Könnten wir sprechen?"]]},
    {note:["Merke","Für den Anfang reichen drei Muster: _Učim._ (ich lerne), _Učio sam._ (ich habe gelernt) und _Učit ću._ oder _Ja ću učiti._ (ich werde lernen)."]}]},

  {id:"g11", bs:"Glagolski vid i zapovjedni način", de:"Verbalaspekt und Imperativ", blocks:[
    {h:["Nesvršeni i svršeni glagoli","Unvollendete und vollendete Verben"]},
    {p:"Viele Verben gibt es als Paar. Das *unvollendete* Verb beschreibt Verlauf, Dauer oder Wiederholung: _pisati_ (schreiben). Das *vollendete* Verb sieht die Handlung als Ganzes oder betont das Ergebnis: _napisati_ (fertig schreiben). Im Deutschen drückt man das mit Zusatzwörtern oder über den Zusammenhang aus."},
    {t:["unvollendet","vollendet","Bedeutung"], r:[
      [["pisati"],["napisati"],"schreiben, fertig schreiben"],[["čitati"],["pročitati"],"lesen, durchlesen"],[["učiti"],["naučiti"],"lernen, erlernen"],[["raditi"],["uraditi"],"arbeiten oder tun, erledigen"]]},
    {ex:[["Čitam knjigu.","Ich lese gerade ein Buch."],["Pročitao sam knjigu.","Ich habe das Buch durchgelesen."],["Učim nove riječi.","Ich lerne neue Wörter."],["Naučio sam pet riječi.","Ich habe fünf Wörter gelernt."]]},
    {warn:["Wichtig","Vollendete Verben stehen im Präsens normalerweise nicht für etwas, das gerade abläuft. Ihr Präsens hat meist Zukunfts- oder Nebensatzbedeutung."]},
    {h:["Imperativ – naredbe i molbe","Aufforderungen und Bitten"]},
    {p:"Zu einer vertrauten Person nimmst du die _ti_-Form (_Piši!_), zu mehreren Personen oder in der höflichen Anrede die _vi_-Form (_Pišite!_). Mit _molim te_ oder _molim Vas_ wird daraus eine höfliche Bitte."},
    {t:["Infinitiv","ti","vi, Vi","Deutsch"], r:[
      ["raditi",["radi!"],["radite!"],"arbeite! arbeitet! arbeiten Sie!"],["pisati",["piši!"],["pišite!"],"schreib! schreibt! schreiben Sie!"],
      ["ići",["idi!"],["idite!"],"geh! geht! gehen Sie!"],["slušati",["slušaj!"],["slušajte!"],"hör zu! hört zu! hören Sie zu!"]]},
    {ex:[["Molim te, ponovi.","Bitte wiederhole es."],["Molim Vas, ponovite.","Bitte wiederholen Sie es."]]}]},

  {id:"g12", bs:"Brojevi, vrijeme i datumi", de:"Zahlen, Uhrzeit, Datum", blocks:[
    {h:["Osnovni brojevi","Grundzahlen"]},
    {p:"Nach einer Zahl ändert sich die Form des Substantivs: _jedan sat_ (eine Stunde), _dva sata_ (zwei Stunden), _pet sati_ (fünf Stunden). _jedan_ hat drei Formen (_jedan, jedna, jedno_), für „zwei“ gibt es _dva_ und _dvije_."},
    {nums:[[0,"nula"],[1,"jedan"],[2,"dva"],[3,"tri"],[4,"četiri"],[5,"pet"],[6,"šest"],[7,"sedam"],[8,"osam"],[9,"devet"],[10,"deset"],[11,"jedanaest"],[12,"dvanaest"],[13,"trinaest"],[20,"dvadeset"],[30,"trideset"],[50,"pedeset"],[100,"sto"]]},
    {go:["numbers","Alle Zahlen und Übungen"]},
    {h:["Dani i mjeseci","Wochentage und Monate"]},
    {p:"Wochentage und Monate schreibt man klein, außer am Satzanfang."},
    {chips:[["ponedjeljak","Montag"],["utorak","Dienstag"],["srijeda","Mittwoch"],["četvrtak","Donnerstag"],["petak","Freitag"],["subota","Samstag"],["nedjelja","Sonntag"]]},
    {chips:[["januar","Januar"],["februar","Februar"],["mart","März"],["april","April"],["maj","Mai"],["juni","Juni"],["juli","Juli"],["august","August"],["septembar","September"],["oktobar","Oktober"],["novembar","November"],["decembar","Dezember"]]},
    {h:["Sat i datum","Uhrzeit und Datum"]},
    {p:"Im Datum steht der Tag als Ordnungszahl mit Punkt: _15. 11. 2026._ Gesprochen sagt man zum Beispiel _petnaesti novembar_ (der fünfzehnte November). _Koliko je sati?_ heißt „Wie spät ist es?“."},
    {ex:[["Koliko je sati?","Wie spät ist es?"],["Sada je osam sati.","Es ist acht Uhr."],["Sada je osam i petnaest.","Es ist acht Uhr fünfzehn."],["Vidimo se u devet sati.","Wir sehen uns um neun Uhr."],
      ["Danas je petnaesti novembar.","Heute ist der fünfzehnte November."],["Rođen sam 12. maja.","Ich bin am 12. Mai geboren."]]}]},

  {id:"g13", bs:"Važne rečenične konstrukcije", de:"Wichtige Satzmuster", blocks:[
    {p:"Manche Wendungen lassen sich nicht Wort für Wort übersetzen. Lerne sie als ganze Sätze. Oft steht _mi_ (mir), wo das Deutsche „ich“ sagt."},
    {ex:[["Imam 25 godina.","Ich bin 25 Jahre alt.","Bosnisch sagt „ich habe“: _imam_"],["Hladno mi je.","Mir ist kalt.","Dativ _mi_ statt „ich“"],["Sviđa mi se ovaj film.","Dieser Film gefällt mir.","Subjekt ist der Film"],
      ["Treba mi pomoć.","Ich brauche Hilfe.","wörtlich: Hilfe ist mir nötig"],["Boli me glava.","Ich habe Kopfschmerzen.","wörtlich: Der Kopf tut mir weh"],["Moram ići.","Ich muss gehen.","_morati_ + Infinitiv"],
      ["Mogu li ući?","Darf ich reinkommen?","_moći_ + Infinitiv"],["Želim vodu.","Ich möchte Wasser.","_željeti_ + Akkusativ"],["Volim muziku.","Ich mag Musik.","_voljeti_ + Akkusativ"],
      ["Znam govoriti bosanski.","Ich kann Bosnisch sprechen.","_znati_ + Infinitiv"]]},
    {h:["Veznici i povezivanje","Konjunktionen"]},
    {p:"_i, ali, jer, ako, da_ und _ili_ verbinden Satzteile. Anders als im Deutschen wandert das Verb im Nebensatz nicht ans Ende."},
    {t:["Bosnisch","Deutsch","Beispiel"], r:[
      [["i"],"und",["Čitam i pišem.","Ich lese und schreibe."]],[["ali"],"aber",["Učim, ali sam umoran.","Ich lerne, aber ich bin müde."]],[["jer"],"weil",["Učim jer imam ispit.","Ich lerne, weil ich eine Prüfung habe."]],
      [["ako"],"wenn, falls",["Ako imam vremena, doći ću.","Wenn ich Zeit habe, komme ich."]],[["da"],"dass, damit",["Znam da si tu.","Ich weiß, dass du hier bist."]],[["ili"],"oder",["Čaj ili kafa?","Tee oder Kaffee?"]]]}]},

  {id:"g14", bs:"Dijalozi iz svakodnevnog života", de:"Alltagsdialoge", blocks:[
    {p:"Bei Unbekannten passen die höflichen Formen _Izvinite_, _Vi_ und _Molim Vas_. Unter Freunden sagt man _Ćao_, _ti_ und _molim te_. Lies die Dialoge laut und setz danach eigene Namen, Orte und Zahlen ein."},
    {h:["U prodavnici","Im Geschäft"]},

    {h:["Upoznavanje","Kennenlernen"]},
    {dlg:[["A","Kako se zoveš?","Wie heißt du?"],["B","Zovem se Lejla. A ti?","Ich heiße Lejla. Und du?"],["A","Ja sam Emir. Odakle si?","Ich bin Emir. Woher kommst du?"],["B","Iz Sarajeva, ali živim u Njemačkoj.","Aus Sarajevo, aber ich lebe in Deutschland."]]},

  {id:"g16", bs:"Vježbe i rješenja", de:"Übungen mit Lösungen", blocks:[
    {p:"Lös die Aufgaben zuerst, ohne die Lösung aufzuklappen. Schreib am besten den ganzen Satz auf. Bei Fällen frag dich: Ist das Wort Subjekt, Objekt, Ort oder Ziel? Beim Perfekt zählt das Geschlecht des Subjekts. Eine andere Wortstellung ist nicht automatisch falsch, wenn der Satz richtig ist und dasselbe bedeutet."},
    {q:{task:"Übersetze ins Deutsche.", parts:["Dobro veče.","Hvala puno.","Gdje živiš?"], sol:["Guten Abend.","Vielen Dank.","Wo wohnst du?"], why:"_Gdje?_ heißt „wo?“."}},
    {q:{task:"Übersetze ins Bosnische. Die Pronomen dürfen wegfallen.", parts:["Ich lerne Bosnisch.","Wir haben Zeit.","Sie (eine Frau) arbeitet heute."], sol:["Učim bosanski.","Imamo vremena.","Ona danas radi."], why:"Die Formen _učim_, _imamo_ und _radi_ zeigen die Person schon an."}},
    {q:{task:"Ergänze die passende Form von _biti_ (sein).", parts:["Ja ___ student.","Ona ___ kod kuće.","Mi ___ prijatelji."], sol:["Ja sam student.","Ona je kod kuće.","Mi smo prijatelji."], why:"Zu _ja_ gehört _sam_, zu _ona_ gehört _je_, zu _mi_ gehört _smo_."}},
    {q:{task:"Ergänze die passende Form von _imati_ (haben).", parts:["Ti ___ knjigu.","On ___ auto.","Vi ___ vremena."], sol:["Ti imaš knjigu.","On ima auto.","Vi imate vremena."], why:"_imaš_ heißt „du hast“, _ima_ „er hat“, _imate_ „ihr habt“ oder „Sie haben“."}},
    {q:{task:"Verneine die Sätze.", parts:["Ja radim.","Ona je umorna.","Imam novac."], sol:["Ja ne radim.","Ona nije umorna.","Nemam novac. (Im Alltag oft: Nemam novca.)"], why:"Bei _raditi_ steht _ne_ getrennt vor dem Verb. _biti_ und _imati_ haben die Sonderformen _nije_ und _nemam_."}},
    {q:{task:"Setz das Wort in Klammern in den richtigen Fall: wohin, wo oder wen?", parts:["Idem u (škola).","Ja sam u (škola).","Vidim (prijatelj)."], sol:["Idem u školu. (Akkusativ)","Ja sam u školi. (Lokativ)","Vidim prijatelja. (Akkusativ, belebt)"], why:"_u školu_ nennt die Richtung, _u školi_ den Ort. Ein männliches belebtes Wort endet im Akkusativ oft auf _-a_."}},
    {q:{task:"Ergänze die richtige Form von _nov_ (neu).", parts:["___ knjiga","___ selo","___ grad"], sol:["nova knjiga","novo selo","nov grad"], why:"Das Adjektiv passt sich dem Geschlecht an: _nova_ (weiblich), _novo_ (sächlich), _nov_ (männlich)."}},
    {q:{task:"Bilde die Vergangenheit von _raditi_ (arbeiten).", parts:["ja (ein Mann)","ja (eine Frau)","mi (gemischte Gruppe)"], sol:["Ja sam radio.","Ja sam radila.","Mi smo radili."], why:"Das Perfekt besteht aus einer Form von _biti_ und dem Partizip, das sich nach Geschlecht und Zahl des Subjekts richtet."}},
    {q:{task:"Setz die Sätze in die Zukunft.", parts:["Ja učim.","Ti radiš.","Mi čitamo."], sol:["Ja ću učiti.","Ti ćeš raditi.","Mi ćemo čitati."], why:"Das Futur I bildest du mit _ću, ćeš, ćemo_ und dem Infinitiv."}},
    {q:{task:"Ergänze die richtige Form von _sat_ (Stunde).", parts:["jedan ___","dva ___","pet ___"], sol:["jedan sat","dva sata","pet sati"], why:"Nach _jedan_ steht _sat_, nach _dva_ steht _sata_, nach _pet_ steht _sati_."}},
    {q:{task:"Mach aus dem Satz eine Ja-Nein-Frage mit _Da li_.", parts:["Ti govoriš bosanski."], sol:["Da li ti govoriš bosanski? Oder: Da li govoriš bosanski?"], why:"_Da li_ steht vor dem Aussagesatz. _ti_ kann bleiben oder wegfallen."}},
    {q:{task:"Übersetze ins Bosnische. Verwende die festen Satzmuster.", parts:["Mir ist kalt.","Ich brauche Hilfe.","Wir gehen zur Arbeit."], sol:["Hladno mi je.","Treba mi pomoć.","Idemo na posao."], why:"Diese Wendungen lernst du am besten als Ganzes. _Hladno mi je_ enthält den Dativ _mi_ (mir)."}},
    {h:["Kako dalje učiti?","Wie geht es weiter?"]},
    {p:"Nimm dir jeden Tag *fünf neue Wörter* vor, schreib *drei einfache Sätze* und sprich sie laut. Wiederhole danach ein Verb im Präsens und ein Beispiel zu einem Fall."}]},

  {id:"g17", bs:"Brzi podsjetnik", de:"Spickzettel: Grammatik auf einen Blick", blocks:[
    {cards:[["3 Geschlechter","muški · ženski · srednji","männlich · weiblich · sächlich"],["7 Fälle","N · G · D · A · V · I · L","Nominativ, Genitiv, Dativ, Akkusativ, Vokativ, Instrumental, Lokativ"],
      ["Präsens","radim · radiš · radi","ich arbeite · du arbeitest · er arbeitet"],["Vergangenheit","radio sam","ich habe gearbeitet (eine Frau sagt: radila sam)"],
      ["Zukunft","ja ću učiti","ich werde lernen"],["Verneinung","ne znam · nisam · nemam","ich weiß nicht · ich bin nicht · ich habe nicht"]]},

function addVocab(item, quiet){
  if (!item || !item.bs) return false;
  if (findVocab(item.bs)){ if (!quiet) toast("Steht schon im Heft."); return false; }
  const id = newId(), now = Date.now();
  S.vocab[id] = {id, bs: clip(item.bs, 200), de: clip(item.de, 200), laut: clip(item.laut || bsToLaut(item.bs), 200), box:1, due: now, added: now, src: item.src || ""};
  save(); if (!quiet) toast("Ins Heft gelegt.");
  return true;
}
const vocabOf = (it, src) => ({bs: it.bs, de: it.de, laut: it.laut || bsToLaut(it.bs), src: src || "Grundwortschatz"});
function starBtn(item){
  const b = h("button", {class:"ibtn", type:"button"});
  const paint = () => { const on = !!findVocab(item.bs); b.innerHTML = on ? I.starOn : I.star; b.setAttribute("aria-label", on ? "Im Heft" : "Merken"); b.style.color = on ? "var(--gold)" : ""; };
  b.onclick = () => { if (!findVocab(item.bs)) addVocab(item); paint(); };
  paint(); return b;
}

/* ---------- quiz ---------- */
let QZ = null;
function quizSources(){ const n = Object.values(S.vocab).filter(v => v.bs && v.de).length; return [["alle","Alles gemischt"], ...WORDS.map(c => [c.id, c.de]), ["zahlen","Zahlen bis 100"], ["heft", `Mein Heft (${n})`]]; }
function quizPool(src){
  if (src === "heft") return Object.values(S.vocab).filter(v => v.bs && v.de).map(v => ({bs: v.bs, de: v.de, laut: v.laut}));
  if (src === "zahlen"){ const out = []; for (let n = 0; n <= 100; n++) out.push({bs: num2bs(n), de: String(n)}); return out; }
  if (src === "alle") return WORDS.flatMap(wordItems);
  const c = WORDS.find(x => x.id === src); return c ? wordItems(c) : [];
}
function numDistractors(n, lo, hi){
  const c = new Set(), add = (x) => { if (x !== n && x >= lo && x <= hi) c.add(x); };
  if (n >= 11 && n <= 19) add((n - 10) * 10);
  if (n % 10 === 0 && n >= 20 && n <= 90) add(10 + n / 10);
  if (n >= 10 && n < 100) add((n % 10) * 10 + Math.floor(n / 10));
  [1, -1, 10, -10, 100, -100, 2, -2].forEach(d => add(n + d));
  const out = shuffle([...c]).slice(0, 3); let guard = 0;
  while (out.length < 3 && guard++ < 300){ const x = lo + Math.floor(Math.random() * (hi - lo + 1)); if (x !== n && !out.includes(x)) out.push(x); }
  return out;
}
function buildQuestions(pool, dir, src){
  const field = dir === "de-bs" ? "bs" : "de", backup = WORDS.flatMap(wordItems);
  return shuffle(pool).slice(0, 10).map(item => {
    let opts;
    if (src === "zahlen" && /^\d+$/.test(item.de)){ const n = Number(item.de); opts = [n, ...numDistractors(n, 0, 100)].map(x => field === "de" ? String(x) : num2bs(x)); }
    else {
      const uniq = [];
      for (const o of shuffle(pool).concat(shuffle(backup))){ if (o[field] && o[field] !== item[field] && !uniq.includes(o[field])) uniq.push(o[field]); if (uniq.length === 3) break; }
      opts = [item[field], ...uniq];
    }
    return {item, answer: item[field], opts: shuffle(opts)};
  });
}
function startQuiz(src, dir, pool){
  pool = pool || quizPool(src);
  if (!pool.length){ toast(src === "heft" ? "In deinem Heft steht noch nichts mit Übersetzung." : "Keine Wörter gefunden."); return; }
  if (dir === "audio" && !canSpeak()) toast("Vorlesen gibt es gerade nicht, darum siehst du das Wort.");
  QZ = {phase:"run", src, dir, qs: buildQuestions(pool, dir, src), i:0, score:0, combo:0, best:0, picked:null, wrong:[], spoke:null};
  render();
}
function pickQuiz(o){
  const q = QZ.qs[QZ.i], idx = QZ.i, my = QZ;
  QZ.picked = o;
  if (o === q.answer){ QZ.score++; QZ.combo++; QZ.best = Math.max(QZ.best, QZ.combo); render(); speak(q.item.bs, false, null);
    setTimeout(() => { if (QZ === my && QZ.i === idx && QZ.phase === "run" && view === "quiz") nextQuiz(); }, 1200); }
  else { QZ.combo = 0; QZ.wrong.push(q.item); autoAdd(q.item, "Quiz", true); render(); speak(q.item.bs, false, null); }
}
function nextQuiz(){ QZ.picked = null; if (QZ.i < QZ.qs.length - 1) QZ.i++; else QZ.phase = "done"; render(); }

  if (!QZ) QZ = {phase:"setup", src:"alle", dir:"bs-de"};

  if (QZ.phase === "setup"){
    main.append(h("section", {class:"stack"}, h("span", {class:"cap", text:"Wörter aus"}), pillChoice(quizSources(), () => QZ.src, (v) => QZ.src = v)),
      h("section", {class:"stack"}, h("span", {class:"cap", text:"Richtung"}), pillChoice([["bs-de","Bosnisch → Deutsch"],["de-bs","Deutsch → Bosnisch"],["audio","Hören → Deutsch"]], () => QZ.dir, (v) => QZ.dir = v)),

  }

/* ================= learning path, frames, listening mode ================= */
const normKey = (s) => normWords(s).join(" ");
S.path = S.path || {done:{}};
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* automatic review: everything learned or missed lands in the Heft */
function autoAdd(item, src, dueNow){
  if (!item || !item.bs) return;
  const ex = findVocab(item.bs), now = Date.now();
  if (ex){ if (dueNow){ ex.box = 1; ex.due = now; ex.miss = (ex.miss || 0) + 1; save(); } return; }
  const id = newId();
  S.vocab[id] = {id, bs: clip(item.bs, 200), de: clip(item.de, 200), laut: clip(item.laut || bsToLaut(item.bs), 200), box:1, due: dueNow ? now : startOfDay(now) + DAY, added: now, src: src || "", personal: !!item.personal};
  if (dueNow) S.vocab[id].miss = 1;
  save();
}
function rateItem(it, r){
  const now = Date.now();
  if (r === "again"){ it.box = 1; it.due = now; it.miss = (it.miss || 0) + 1; }
  else if (r === "hard"){ it.box = Math.max(1, it.box || 1); it.due = startOfDay(now) + DAY; }
  else { it.box = Math.min(6, (it.box || 1) + 1); it.due = startOfDay(now) + BOX_DAYS[it.box] * DAY; }
  save();
}
const nextLabel = (b) => { const d = BOX_DAYS[Math.min(6, b)]; return d <= 1 ? "morgen" : `in ${d} Tagen`; };

function lessonItems(L){
  const nm = P().name, fill = (s) => s.replace(/\{ime\}/g, nm);
  if (L.nums){ const out = []; for (let n = L.nums[0]; n <= L.nums[1]; n++) out.push({bs: num2bs(n), de: String(n)}); return out; }
  if (L.numsList) return L.numsList.map(n => ({bs: num2bs(n), de: String(n)}));
  if (L.prices) return L.prices.map(n => ({bs: priceBs(n), de: `${n} KM`}));
  if (L.frames) return L.frames.flatMap(id => { const f = FRAMES.find(x => x.id === id); return f ? f.items.map(x => ({bs: x[0], de: x[1], cue: x[2], frame: f.bs})) : []; });
  if (L.personal) return Object.values(S.vocab).filter(v => v.personal).sort((a, b) => (a.added || 0) - (b.added || 0)).slice(0, 8).map(v => ({bs: v.bs, de: v.de, laut: v.laut}));
  return L.items.filter(x => nm || !x[0].includes("{ime}")).map(x => ({bs: fill(x[0]), de: fill(x[1])}));
}
const currentLesson = () => LESSONS.find(L => !S.path.done[L.id]) || null;
const lessonNo = (L) => LESSONS.indexOf(L) + 1;
function checkBackup(){ return WORDS.flatMap(wordItems).concat(FRAMES.flatMap(f => f.items.map(x => ({bs: x[0], de: x[1]})))); }
function buildCheck(items){
  const backup = checkBackup();
  return shuffle(items).slice(0, 8).map(item => {
    let opts; const m = String(item.de).match(/^(\d+)( KM)?$/);
    if (m){ const n = Number(m[1]); opts = [n, ...numDistractors(n, Math.max(m[2] ? 1 : 0, n - 20), n + 20)].map(x => m[2] ? `${x} KM` : String(x)); }
    else { const uniq = []; for (const o of shuffle(items).concat(shuffle(backup))){ if (o.de && o.de !== item.de && !uniq.includes(o.de)) uniq.push(o.de); if (uniq.length === 3) break; } opts = [item.de, ...uniq]; }
    return {item, answer: item.de, opts: shuffle(opts)};
  });
}

/* ---------- listening mode engine (Pimsleur principle: prompt, pause, answer, growing gaps) ---------- */
let HM = null;
const HM_STOP = {};
const deVoiceOf = () => voices.find(v => /^de/i.test((v.lang || "").replace("_", "-"))) || null;
function primeSpeech(){ try{ if (synth){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); } }catch(e){} }
function sayP(text, v, rate){
  return new Promise((resolve) => {
    const len = String(text).length;
    if (!synth || !v){ setTimeout(resolve, 700 + len * 70); return; }
    let done = false;
    const fin = () => { if (!done){ done = true; clearTimeout(t); resolve(); } };
    const t = setTimeout(fin, 2500 + len * 160 / (rate || 1));
    try{ const u = new SpeechSynthesisUtterance(String(text)); u.voice = v; u.lang = v.lang; u.rate = rate || 1; u.onend = u.onerror = fin; synth.speak(u); }catch(e){ fin(); }
  });
}
async function hmGuard(my){ while (HM && HM.token === my && HM.paused) await sleep(150); if (!HM || HM.token !== my) throw HM_STOP; }
async function hmWait(ms, my){ let t = 0; while (t < ms){ if (!HM || HM.token !== my) throw HM_STOP; if (!HM.paused) t += 100; await sleep(100); } }
function hmCreate(items, offsets){
  const offs = offsets || [0, 2, 5, 9], ev = [];
  items.forEach((it, j) => offs.forEach((o, r) => ev.push({it, r, pos: j * 3 + o + r * 0.01})));
  ev.sort((a, b) => a.pos - b.pos);
  HM = {events: ev, pos: 0, paused: false, running: false, finished: false, stage: "", token: null, cur: null, paint: null};
  return HM;
}
function hmPaint(){ if (HM && HM.paint) HM.paint(); }
async function hmRun(){
  const my = {}; HM.token = my; HM.running = true; HM.finished = false; keepAwake(true);
  const bsV = voice, deV = deVoiceOf(), mult = ({kurz:0.75, normal:1, lang:1.4})[ST().hmPause] || 1;
  const think = (s) => (1600 + normWords(s).length * 550) * mult;
  try{
    while (HM.pos < HM.events.length){
      const ev = HM.events[HM.pos]; HM.cur = ev;
      if (ev.r === 0){
        HM.stage = "hear"; hmPaint(); await sayP(ev.it.bs, bsV, Math.min(0.75, ST().rate)); await hmGuard(my);
        HM.stage = "repeat"; hmPaint(); await hmWait(think(ev.it.bs), my);
        HM.stage = "again"; hmPaint(); await sayP(ev.it.bs, bsV, ST().rate); await hmGuard(my);
      } else {
        HM.stage = "prompt"; hmPaint(); if (deV) await sayP(ev.it.de, deV, 1); else await hmWait(1500, my); await hmGuard(my);
        HM.stage = "think"; hmPaint(); await hmWait(think(ev.it.bs), my);
        HM.stage = "answer"; hmPaint(); await sayP(ev.it.bs, bsV, ST().rate); await hmGuard(my); countSpoken();
      }
      await hmWait(900, my); HM.pos++; lastAct = Date.now();
    }
    HM.running = false; HM.finished = true; HM.stage = "done"; keepAwake(false); hmPaint();
  }catch(e){ if (e !== HM_STOP) throw e; }
}
function hmStop(){ if (HM){ HM.token = null; HM.running = false; } keepAwake(false); try{ synth && synth.cancel(); }catch(e){} }
/* Bildschirm wach halten, solange Hören & Sagen läuft (Wake Lock, wo verfügbar). */
let wakeLock = null;
async function keepAwake(on){
  try{
    if (on){ if (!wakeLock && navigator.wakeLock){ const w = await navigator.wakeLock.request("screen"); wakeLock = w; w.addEventListener("release", () => { if (wakeLock === w) wakeLock = null; }); } }
    else if (wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && HM && HM.running) keepAwake(true); });
function hmPanel(onDone, doneLabel){
  const STAGE = {hear:"Hör zu", repeat:"Sprich nach", again:"Nochmal hören", prompt:"Wie sagt man das?", think:"Sag es laut auf Bosnisch", answer:"So heißt es", done:"Fertig"};
  const cap = h("span", {class:"cap", text:"Hören & Sagen"});
  const de = h("div", {class:"de", style:"font-size:1.15rem;color:var(--fg)"});
  const bs = h("div", {class:"bs", style:"font-size:1.6rem;min-height:2.1em"});
  const laut = h("div", {class:"laut"});
  const prog = h("div", {class:"prog"});
  const btns = h("div", {class:"row", style:"justify-content:center"});
  const card = h("section", {class:"card practice"}, prog, cap, de, bs, laut, btns);
  const paint = () => {
    if (!HM) return;
    const n = HM.events.length, ev = HM.cur;
    prog.textContent = ""; const segs = 12; for (let i = 0; i < segs; i++) prog.append(h("i", {class: (i + 1) / segs <= HM.pos / n ? "done" : ""}));
    cap.textContent = HM.running || HM.finished ? (STAGE[HM.stage] || "") : "Hören & Sagen";
    const showBs = ["hear","repeat","again","answer"].includes(HM.stage);
    de.textContent = ev ? ev.it.de : (HM.finished ? "" : "Die App sagt dir einen Satz auf Deutsch. In der Pause sagst du ihn laut auf Bosnisch, dann hörst du die Lösung. Neue Sätze hörst du zuerst und sprichst sie nach. Sätze kommen in wachsenden Abständen wieder.");
    bs.textContent = ev && showBs ? ev.it.bs : (ev && !HM.finished ? "…" : "");
    laut.textContent = ev && showBs ? "≈ " + (ev.it.laut || bsToLaut(ev.it.bs)) : "";
    if (HM.finished){ de.textContent = `${n} Durchgänge geschafft.`; bs.textContent = ""; laut.textContent = ""; }
    btns.textContent = "";
    if (!HM.running && !HM.finished) btns.append(h("button", {class:"btn", type:"button", text: HM.pos ? "Weiter" : "Start", onclick: () => { primeSpeech(); HM.paused = false; hmRun(); }}));
    else if (HM.running) btns.append(h("button", {class:"btn ghost", type:"button", text: HM.paused ? "Fortsetzen" : "Pause", onclick: () => { HM.paused = !HM.paused; paint(); }}));
    if (HM.finished || (onDone && HM.running)) btns.append(h("button", {class: HM.finished ? "btn" : "tbtn", type:"button", text: HM.finished ? (doneLabel || "Fertig") : "Überspringen", onclick: () => { hmStop(); onDone && onDone(); }}));
  };
  HM.paint = paint; paint();
  const out = [card];
  if (!canSpeak()) out.push(h("p", {class:"note", text:"Ohne bosnische oder kroatische Stimme läuft der Hör-Modus nur mit Text. Unter Einstellungen steht, wie du eine Stimme lädst."}));
  else if (!deVoiceOf()) out.push(h("p", {class:"note", text:"Keine deutsche Stimme gefunden: Die deutsche Vorgabe steht dann nur als Text da."}));
  return out;
}

/* ---------- today's session ---------- */
let SE = null;
function startLesson(L, mode){
  hmStop();
  if (!L){ startReviewSession(); return; }
  const items = lessonItems(L);
  if (!items.length){ SE = {lesson: L, empty: true}; go("session"); return; }
  const keys = new Set(items.map(i => normKey(i.bs)));
  const rev = mode === "test" ? [] : dueItems().filter(v => !keys.has(normKey(v.bs))).sort((a, b) => (a.due || 0) - (b.due || 0)).slice(0, 8).map(v => v.id);
  const steps = [];
  if (rev.length) steps.push({t:"review", ids: rev});
  if (mode !== "test"){
    steps.push({t:"intro", items});
    steps.push({t:"listen", items: items.slice(0, 8).concat(rev.slice(0, 2).map(id => ({bs: S.vocab[id].bs, de: S.vocab[id].de, laut: S.vocab[id].laut})))});
  }
  steps.push({t:"check", qs: buildCheck(items)});
  SE = {lesson: L, steps, si: 0, ii: 0, queue: null, requeued: {}, revealed: false, result: null, picked: null, score: 0, spoke: null};
  go("session");
}
function startReviewSession(){
  const due = dueItems().sort((a, b) => (a.due || 0) - (b.due || 0));
  if (!due.length){ toast("Alle Etappen geschafft und nichts fällig. Morgen geht es mit Wiederholungen weiter."); return; }

/* ---------- exchange codes & backup ---------- */
function b64encode(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* reads both kinds of code: PRICAJ: (sentence list from the Claude version) and PRICAJ-SICHERUNG: (full backup) */
function parseCode(code){

  const m = raw.match(/PRICAJ(-SICHERUNG)?:([A-Za-z0-9+/=_-]+)/);
  if (!m) throw new Error("Kein gültiger Code. Er beginnt mit PRICAJ: oder PRICAJ-SICHERUNG:");
  let data;
  try{ data = JSON.parse(b64decode(m[2])); }catch(e){ throw new Error("Der Code ist unvollständig. Bitte komplett kopieren."); }
  if (m[1]){
    if (!data || data.kind !== "backup" || !data.data) throw new Error("Die Sicherung ist beschädigt.");
    return {kind:"backup", at: data.at, data: data.data};
  }
  if (!data || !Array.isArray(data.items)) throw new Error("Der Code enthält keine Sätze.");
  return {kind:"items", items: data.items};
}

    const ex = findVocab(it.bs);
    if (ex){ if (it.p && !ex.personal){ ex.personal = true; n++; } continue; }
    autoAdd({bs: it.bs, de: it.de || "", laut: it.laut || "", personal: !!it.p}, it.p ? "Über mich" : "Claude-Version", false); n++;
  }
  save(); return n;
}
/* merge a backup into the current data: nothing already here gets lost */
function mergeBackup(d){
  const r = {vocab:0, days:0, etappen:0};
  const fresh = !S.profile.onboarded;
  if (d.profile && typeof d.profile === "object"){
    if (fresh){ S.profile = Object.assign(freshProfile(), d.profile); S.profile.settings = Object.assign({...DEFAULT_SETTINGS}, d.profile.settings || {}); S.profile.onboarded = true; }
    else {
      if (!S.profile.name && d.profile.name) S.profile.name = clip(d.profile.name, 40);
      S.profile.lastBackup = Math.max(S.profile.lastBackup || 0, d.profile.lastBackup || 0) || undefined;
    }
  }
  for (const v of Object.values(d.vocab || {})){
    if (!v || !v.bs) continue;
    const ex = findVocab(v.bs);
    if (!ex){
      const id = newId();
      S.vocab[id] = {id, bs: clip(v.bs, 200), de: clip(v.de, 200), laut: clip(v.laut || bsToLaut(v.bs), 200), box: v.box || 1, due: v.due || Date.now(), added: v.added || Date.now(), src: v.src || "", personal: !!v.personal};
      if (v.miss > 0) S.vocab[id].miss = Number(v.miss) || 0;
      r.vocab++;
    } else {
      if ((v.box || 1) > (ex.box || 1)){ ex.box = v.box; ex.due = v.due; }
      if (v.personal) ex.personal = true;
      if ((Number(v.miss) || 0) > (ex.miss || 0)) ex.miss = Number(v.miss);
      if (!ex.de && v.de) ex.de = v.de;
    }
  }
  for (const [k, x] of Object.entries(d.days || {})){
    if (!x) continue;
    const cur = S.days[k];
    if (!cur){ S.days[k] = {sec: x.sec || 0, spoken: x.spoken || 0}; r.days++; }
    else { cur.sec = Math.max(cur.sec || 0, x.sec || 0); cur.spoken = Math.max(cur.spoken || 0, x.spoken || 0); }
  }
  for (const [id, when] of Object.entries((d.path && d.path.done) || {})){
    if (!S.path.done[id]){ S.path.done[id] = when; r.etappen++; }
  }
  store.set("pricaj-app", S); applyBodyClasses();
  return r;
}
function applyCode(code){
  const c = parseCode(code);
  if (c.kind === "items"){ const n = importItems(c.items); return n ? `${n} Einträge übernommen.` : "Alles war schon im Heft."; }
  const r = mergeBackup(c.data);
  const parts = [r.vocab ? `${r.vocab} Einträge` : "", r.etappen ? `${r.etappen} Etappen` : "", r.days ? `${r.days} Lerntage` : ""].filter(Boolean);
  return parts.length ? `Sicherung eingespielt: ${parts.join(", ")} dazugekommen.` : "Sicherung eingespielt. Es war schon alles da.";
}
function backupCode(){ return "PRICAJ-SICHERUNG:" + b64encode(JSON.stringify({v:1, kind:"backup", at: Date.now(), data: {profile: S.profile, vocab: S.vocab, days: S.days, path: S.path}})); }
function markBackup(){ S.profile.lastBackup = Date.now(); save(); }
const daysSince = (t) => Math.floor((startOfDay(Date.now()) - startOfDay(t)) / DAY);
function backupAge(){
  const t = S.profile.lastBackup;
  if (!t) return "Noch keine Sicherung.";
  const d = daysSince(t);
  return `Letzte Sicherung: ${d === 0 ? "heute" : d === 1 ? "gestern" : `vor ${d} Tagen`}.`;
}
async function shareBackup(){
  const code = backupCode(), name = `pricaj-sicherung-${dayKey()}.txt`;
  try{
    const file = new File([code], name, {type:"text/plain"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Pričaj-Sicherung"});
      markBackup(); toast("Gesichert."); render(); return;
    }
    if (navigator.share){ await navigator.share({title:"Pričaj-Sicherung", text: code}); markBackup(); toast("Gesichert."); render(); return; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  copyBackup();
}
function copyBackup(){
  const code = backupCode();
  const done = () => { markBackup(); toast("Code kopiert. Füg ihn z. B. in eine Notiz ein."); render(); };
  try{
    navigator.clipboard.writeText(code).then(done, () => showCode(code));
  }catch(e){ showCode(code); }
}
function showCode(code){
  const box = document.getElementById("backupOut"); if (!box) return;
  box.textContent = "";
  const ta = h("textarea", {class:"textin", rows:"4", readonly:"readonly", style:"font-size:.75rem"}); ta.value = code;
  box.append(h("p", {class:"muted small", text:"Kopieren ging nicht automatisch: Text lange drücken, „Alles auswählen“, dann „Kopieren“."}), ta);
  ta.focus(); ta.select(); markBackup();
}
function restoreBox(opts){
  opts = opts || {};
  const ta = h("textarea", {class:"textin", rows:"3", placeholder:"Code hier einfügen (beginnt mit PRICAJ)", style:"resize:vertical"});
  const file = h("input", {type:"file", accept:".txt,.json,text/plain,application/json", style:"display:none"});
  const run = (text) => {
    try{ const msg = applyCode(text); toast(msg); ta.value = ""; if (opts.onDone) opts.onDone(); else render(); }
    catch(e){ toast(e.message || "Der Code ließ sich nicht lesen."); }
  };
  file.addEventListener("change", async () => { const f = file.files && file.files[0]; if (!f) return; try{ run(await f.text()); }catch(e){ toast("Die Datei ließ sich nicht lesen."); } file.value = ""; });
  return h("details", {class:"card", open: opts.open ? "open" : null}, h("summary", {text: opts.title || "Sicherung oder Code einspielen"}), h("div", {class:"stack"},
    h("p", {class:"muted small", text: opts.help || "Eine Sicherungsdatei wählen oder einen Code einfügen. Bestehende Daten bleiben erhalten, nur Neues kommt dazu."}),
    h("button", {class:"btn sec", type:"button", text:"Sicherungsdatei wählen", onclick: () => file.click()}), file,
    ta, h("button", {class:"btn", type:"button", text:"Einspielen", onclick: () => run(ta.value)})));
}
function importBox(){
  return restoreBox({title:"Sätze aus der Claude-Version übernehmen", help:"In der Claude-Version unter „Sprechen → Sätze über mich“ oder im Heft auf „Für die iPhone-App kopieren“ tippen, dann hier einfügen. Eine Sicherung kannst du hier ebenfalls einspielen."});
}
function backupCard(){
  return h("section", {class:"card set"}, h("h3", {text:"Sicherung"}),
    h("p", {class:"muted small", text:"Deine Daten liegen nur in dieser App auf diesem iPhone. Löschst du das Symbol, sind sie weg. Eine Sicherung enthält Heft, Lernpfad, Lerntage und Einstellungen."}),
    h("p", {style:"font-weight:600", text: backupAge()}),
    h("div", {class:"row"}, h("button", {class:"btn", type:"button", text:"Sicherung speichern", onclick: shareBackup}), h("button", {class:"btn ghost", type:"button", text:"Als Code kopieren", onclick: copyBackup})),
    h("p", {class:"muted small", text:"„Sicherung speichern“ öffnet das Teilen-Menü: „In Dateien sichern“ legt eine kleine Textdatei ab, z. B. in iCloud Drive."}),
    h("div", {id:"backupOut", class:"stack"}),
    restoreBox());
}

/* ================= boot ================= */
applyBodyClasses();
loadVoices();
if (synth) try{ synth.addEventListener("voiceschanged", () => { const had = canSpeak(); loadVoices(); if (had !== canSpeak() && !["quiz","numbers","shadow","cards"].includes(view)) render(); }); }catch(e){}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden"){ clearTimeout(saveTimer); store.set("pricaj-app", S); } });
render();
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then((reg) => {
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "activated" && hadController){
          const t = $("toast"); t.hidden = false; t.textContent = "";
          t.append("Neue Version da. ", h("button", {class:"tbtn", type:"button", style:"margin-left:6px;color:var(--fg)", text:"Jetzt laden", onclick: () => location.reload()}));
          clearTimeout(toastTimer);
        }
      });
    });
  }).catch(() => {});
}
})();
</script>
