.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}

function bsToLaut(s){ const t = String(s).toLowerCase(), V = /[aeiou]/; let o = ""; for (let i = 0; i < t.length; i++){ if (t[i] === "d" && t[i + 1] === "ž"){ o += "dsch"; i++; continue; } if (t[i] === "s"){ o += V.test(t[i - 1] || "") && V.test(t[i + 1] || "") ? "ss" : "s"; continue; } o += LMAP[t[i]] ?? t[i]; } return o; }
const ONES = ["nula","jedan","dva","tri","četiri","pet","šest","sedam","osam","devet"];
const TEENS = ["deset","jedanaest","dvanaest","trinaest","četrnaest","petnaest","šesnaest","sedamnaest","osamnaest","devetnaest"];
const TENS = ["","","dvadeset","trideset","četrdeset","pedeset","šezdeset","sedamdeset","osamdeset","devedeset"];
const HUNDS = ["","sto","dvjesto","trista","četiristo","petsto","šeststo","sedamsto","osamsto","devetsto"];
function below1000(n, fem){
  const out = [], hd = Math.floor(n / 100), r = n % 100;
  if (hd) out.push(HUNDS[hd]);
  if (r >= 10 && r < 20) out.push(TEENS[r - 10]);
  else { const t = Math.floor(r / 10), o = r % 10; if (t >= 2) out.push(TENS[t]); if (o) out.push(fem && o === 1 ? "jedna" : fem && o === 2 ? "dvije" : ONES[o]); }
  return out.join(" ");
}
function plural(n, one, few, many){ const l2 = n % 100, l = n % 10; if (l2 >= 11 && l2 <= 14) return many; if (l === 1) return one; if (l >= 2 && l <= 4) return few; return many; }
function num2bs(n, fem){
  if (n === 0) return "nula";
  const th = Math.floor(n / 1000), r = n % 1000, out = [];
  if (th === 1) out.push("hiljadu"); else if (th > 1) out.push(below1000(th, true) + " " + plural(th, "hiljada", "hiljade", "hiljada"));
  if (r) out.push(below1000(r, fem));

const loose = (w) => w.replace(/[čć]/g, "c").replace(/dž/g, "dz").replace(/đ/g, "dj").replace(/š/g, "s").replace(/ž/g, "z");
function compare(target, said){
  const T = normWords(target), A = normWords(said), n = T.length, m = A.length;
  const dp = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = loose(T[i]) === loose(A[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const res = []; let i = 0, j = 0;
  while (i < n){
    if (j < m && loose(T[i]) === loose(A[j])){ res.push({w:T[i], s: T[i] === A[j] ? "ok" : "near"}); i++; j++; }
    else if (j < m && dp[i][j + 1] >= dp[i + 1][j]) j++;

  }

/* ================= learning path, frames, listening mode ================= */
const normKey = (s) => normWords(s).join(" ");
S.path = S.path || {done:{}};
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* automatic review: everything learned or missed lands in the Heft */
function autoAdd(item, src, dueNow){
  if (!item || !item.bs) return;
  const ex = findVocab(item.bs), now = Date.now();
  if (ex){ if (dueNow){ ex.box = 1; ex.due = now; save(); } return; }
  const id = newId();
  S.vocab[id] = {id, bs: clip(item.bs, 200), de: clip(item.de, 200), laut: clip(item.laut || bsToLaut(item.bs), 200), box:1, due: dueNow ? now : startOfDay(now) + DAY, added: now, src: src || "", personal: !!item.personal};
  save();
}
function rateItem(it, r){
  const now = Date.now();
  if (r === "again"){ it.box = 1; it.due = now; }
  else if (r === "hard"){ it.box = Math.max(1, it.box || 1); it.due = startOfDay(now) + DAY; }
  else { it.box = Math.min(6, (it.box || 1) + 1); it.due = startOfDay(now) + BOX_DAYS[it.box] * DAY; }
  save();
}
const nextLabel = (b) => { const d = BOX_DAYS[Math.min(6, b)]; return d <= 1 ? "morgen" : `in ${d} Tagen`; };

function lessonItems(L){
  const nm = P().name, fill = (s) => s.replace(/\{ime\}/g, nm);
  if (L.nums){ const out = []; for (let n = L.nums[0]; n <= L.nums[1]; n++) out.push({bs: num2bs(n), de: String(n)}); return out; }
  if (L.numsList) return L.numsList.map(n => ({bs: num2bs(n), de: String(n)}));
  if (L.prices) return L.prices.map(n => ({bs: priceBs(n), de: `${n} KM`}));
  if (L.frames) return L.frames.flatMap(id => { const f = FRAMES.find(x => x.id === id); return f ? f.items.map(x => ({bs: x[0], de: x[1], cue: x[2], frame: f.bs})) : []; });
  if (L.personal) return Object.values(S.vocab).filter(v => v.personal).sort((a, b) => (a.added || 0) - (b.added || 0)).slice(0, 8).map(v => ({bs: v.bs, de: v.de, laut: v.laut}));
  return L.items.filter(x => nm || !x[0].includes("{ime}")).map(x => ({bs: fill(x[0]), de: fill(x[1])}));
}
const currentLesson = () => LESSONS.find(L => !S.path.done[L.id]) || null;
const lessonNo = (L) => LESSONS.indexOf(L) + 1;
function checkBackup(){ return WORDS.flatMap(wordItems).concat(FRAMES.flatMap(f => f.items.map(x => ({bs: x[0], de: x[1]})))); }
function buildCheck(items){
  const backup = checkBackup();
  return shuffle(items).slice(0, 8).map(item => {
    let opts; const m = String(item.de).match(/^(\d+)( KM)?$/);
    if (m){ const n = Number(m[1]); opts = [n, ...numDistractors(n, Math.max(m[2] ? 1 : 0, n - 20), n + 20)].map(x => m[2] ? `${x} KM` : String(x)); }
    else { const uniq = []; for (const o of shuffle(items).concat(shuffle(backup))){ if (o.de && o.de !== item.de && !uniq.includes(o.de)) uniq.push(o.de); if (uniq.length === 3) break; } opts = [item.de, ...uniq]; }
    return {item, answer: item.de, opts: shuffle(opts)};
  });
}

/* ---------- listening mode engine (Pimsleur principle: prompt, pause, answer, growing gaps) ---------- */
let HM = null;
const HM_STOP = {};
const deVoiceOf = () => voices.find(v => /^de/i.test((v.lang || "").replace("_", "-"))) || null;
function primeSpeech(){ try{ if (synth){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); } }catch(e){} }
function sayP(text, v, rate){
  return new Promise((resolve) => {
    const len = String(text).length;
    if (!synth || !v){ setTimeout(resolve, 700 + len * 70); return; }
    let done = false;
    const fin = () => { if (!done){ done = true; clearTimeout(t); resolve(); } };
    const t = setTimeout(fin, 2500 + len * 160 / (rate || 1));
    try{ const u = new SpeechSynthesisUtterance(String(text)); u.voice = v; u.lang = v.lang; u.rate = rate || 1; u.onend = u.onerror = fin; synth.speak(u); }catch(e){ fin(); }
  });
}
async function hmGuard(my){ while (HM && HM.token === my && HM.paused) await sleep(150); if (!HM || HM.token !== my) throw HM_STOP; }
async function hmWait(ms, my){ let t = 0; while (t < ms){ if (!HM || HM.token !== my) throw HM_STOP; if (!HM.paused) t += 100; await sleep(100); } }
function hmCreate(items, offsets){
  const offs = offsets || [0, 2, 5, 9], ev = [];
  items.forEach((it, j) => offs.forEach((o, r) => ev.push({it, r, pos: j * 3 + o + r * 0.01})));
  ev.sort((a, b) => a.pos - b.pos);
  HM = {events: ev, pos: 0, paused: false, running: false, finished: false, stage: "", token: null, cur: null, paint: null, onDone: null};
  return HM;
}
function hmPaint(){ if (HM && HM.paint) HM.paint(); }
async function hmRun(){
  const my = {}; HM.token = my; HM.running = true; HM.finished = false;
  const bsV = voice, deV = deVoiceOf(), mult = ({kurz:0.75, normal:1, lang:1.4})[ST().hmPause] || 1;
  const think = (s) => (1600 + normWords(s).length * 550) * mult;
  try{
    while (HM.pos < HM.events.length){
      const ev = HM.events[HM.pos]; HM.cur = ev;
      if (ev.r === 0){
        HM.stage = "hear"; hmPaint(); await sayP(ev.it.bs, bsV, Math.min(0.75, ST().rate)); await hmGuard(my);
        HM.stage = "repeat"; hmPaint(); await hmWait(think(ev.it.bs), my);
        HM.stage = "again"; hmPaint(); await sayP(ev.it.bs, bsV, ST().rate); await hmGuard(my);
      } else {
        HM.stage = "prompt"; hmPaint(); if (deV) await sayP(ev.it.de, deV, 1); else await hmWait(1500, my); await hmGuard(my);
        HM.stage = "think"; hmPaint(); await hmWait(think(ev.it.bs), my);
        HM.stage = "answer"; hmPaint(); await sayP(ev.it.bs, bsV, ST().rate); await hmGuard(my); countSpoken();
      }
      await hmWait(900, my); HM.pos++; lastAct = Date.now();
    }
    HM.running = false; HM.finished = true; HM.stage = "done"; hmPaint();
  }catch(e){ if (e !== HM_STOP) throw e; }
}
function hmStop(){ if (HM){ HM.token = null; HM.running = false; } try{ synth && synth.cancel(); }catch(e){} }
function hmPanel(onDone, doneLabel){
  const STAGE = {hear:"Hör zu", repeat:"Sprich nach", again:"Nochmal hören", prompt:"Wie sagt man das?", think:"Sag es laut auf Bosnisch", answer:"So heißt es", done:"Fertig"};
  const cap = h("span", {class:"cap", text:"Hören & Sagen"});
  const de = h("div", {class:"de", style:"font-size:1.15rem;color:var(--fg)"});
  const bs = h("div", {class:"bs", style:"font-size:1.6rem;min-height:2.1em"});
  const laut = h("div", {class:"laut"});
  const prog = h("div", {class:"prog"});
  const btns = h("div", {class:"row", style:"justify-content:center"});
  const card = h("section", {class:"card practice"}, prog, cap, de, bs, laut, btns);
  const paint = () => {
    if (!HM) return;
    const n = HM.events.length, ev = HM.cur;
    prog.textContent = ""; const segs = 12; for (let i = 0; i < segs; i++) prog.append(h("i", {class: (i + 1) / segs <= HM.pos / n ? "done" : ""}));
    cap.textContent = HM.running || HM.finished ? (STAGE[HM.stage] || "") : "Hören & Sagen";
    const showBs = ["hear","repeat","again","answer"].includes(HM.stage);
    de.textContent = ev ? ev.it.de : (HM.finished ? "" : "Die App sagt dir einen Satz auf Deutsch. In der Pause sagst du ihn laut auf Bosnisch, dann hörst du die Lösung. Neue Sätze hörst du zuerst und sprichst sie nach. Sätze kommen in wachsenden Abständen wieder.");
    bs.textContent = ev && showBs ? ev.it.bs : (ev && !HM.finished ? "…" : "");
    laut.textContent = ev && showBs ? "≈ " + (ev.it.laut || bsToLaut(ev.it.bs)) : "";
    if (HM.finished){ de.textContent = `${n} Durchgänge geschafft.`; bs.textContent = ""; laut.textContent = ""; }
    btns.textContent = "";
    if (!HM.running && !HM.finished) btns.append(h("button", {class:"btn", type:"button", text: HM.pos ? "Weiter" : "Start", onclick: () => { primeSpeech(); HM.paused = false; hmRun(); }}));
    else if (HM.running) btns.append(h("button", {class:"btn ghost", type:"button", text: HM.paused ? "Fortsetzen" : "Pause", onclick: () => { HM.paused = !HM.paused; paint(); }}));
    if (HM.finished || (onDone && HM.running)) btns.append(h("button", {class: HM.finished ? "btn" : "tbtn", type:"button", text: HM.finished ? (doneLabel || "Fertig") : "Überspringen", onclick: () => { hmStop(); onDone && onDone(); }}));
  };
  HM.paint = paint; paint();
  const out = [card];
  if (!canSpeak()) out.push(h("p", {class:"note", text:"Ohne bosnische oder kroatische Stimme läuft der Hör-Modus nur mit Text. Unter Einstellungen steht, wie du eine Stimme lädst."}));
  else if (!deVoiceOf()) out.push(h("p", {class:"note", text:"Keine deutsche Stimme gefunden: Die deutsche Vorgabe steht dann nur als Text da."}));
  return out;
}

/* ---------- today's session ---------- */
let SE = null;
function startLesson(L, mode){
  hmStop();
  if (!L){ startReviewSession(); return; }
  const items = lessonItems(L);
  if (!items.length){ SE = {lesson: L, empty: true}; go("session"); return; }
  const keys = new Set(items.map(i => normKey(i.bs)));
  const rev = mode === "test" ? [] : dueItems().filter(v => !keys.has(normKey(v.bs))).sort((a, b) => (a.due || 0) - (b.due || 0)).slice(0, 8).map(v => v.id);
  const steps = [];
  if (rev.length) steps.push({t:"review", ids: rev});
  if (mode !== "test"){
    steps.push({t:"intro", items});
    steps.push({t:"listen", items: items.slice(0, 8).concat(rev.slice(0, 2).map(id => ({bs: S.vocab[id].bs, de: S.vocab[id].de, laut: S.vocab[id].laut})))});
  }
  steps.push({t:"check", qs: buildCheck(items)});
  SE = {lesson: L, mode, steps, si: 0, ii: 0, queue: null, requeued: {}, revealed: false, result: null, picked: null, score: 0, spoke: null, items};
  go("session");
}
function startReviewSession(){
  const due = dueItems().sort((a, b) => (a.due || 0) - (b.due || 0));
  if (!due.length){ toast("Alle Etappen geschafft und nichts fällig. Morgen geht es mit Wiederholungen weiter."); return; }
  const rev = due.slice(0, 15).map(v => v.id);
  SE = {lesson: null, mode: "review", steps: [{t:"review", ids: rev}, {t:"listen", items: rev.slice(0, 8).map(id => ({bs: S.vocab[id].bs, de: S.vocab[id].de, laut: S.vocab[id].laut}))}], si: 0, ii: 0, queue: null, requeued: {}, revealed: false, result: null, picked: null, score: 0, spoke: null, items: []};
  go("session");
}
function seNextStep(){
  const st = SE.steps[SE.si];

  SE.si++; SE.ii = 0; SE.queue = null; SE.revealed = false; SE.result = null; SE.picked = null; SE.spoke = null;

}

function stepReview(main, st){

}

  main.append(h("section", {class:"stack"}, h("span", {class:"cap", text:"Sätze aus"}), pillChoice(Object.entries(sources).map(([k, v]) => [k, `${v[0]} (${v[1].length})`]), () => HMsrc, (v) => HMsrc = v)),
    h("section", {class:"stack"}, h("span", {class:"cap", text:"Bedenkzeit"}), pillChoice([["kurz","kurz"],["normal","normal"],["lang","lang"]], () => ST().hmPause, (v) => { ST().hmPause = v; save(); })),
    h("p", {class:"muted small", text:"8 Sätze, jeder kommt viermal: erst zum Nachsprechen, dann als Abruf in wachsenden Abständen. Etwa 8 bis 10 Minuten. Der Bildschirm sollte dabei anbleiben."}),

function frameDrill(hdr, main, f){
  header(hdr, f.bs, `${DR.i + 1} von ${DR.items.length}`, {back:true, onBack: () => { DR = null; render(); }});

      h("div", {class:"row", style:"justify-content:center"}, h("button", {class:"btn", type:"button", text:"Nochmal", onclick: () => { DR = {f, items: shuffle(f.items), i: 0, result: null, score: []}; render(); }}), h("button", {class:"btn ghost", type:"button", text:"Andere Baukästen", onclick: () => { DR = null; go("frames"); }}))));

  }

    h("span", {class:"cap", text:"Bilde den Satz und sag ihn laut"}), h("div", {class:"bs", text: f.bs}), h("span", {class:"pill on", text: x[2]}), h("div", {class:"de", text: x[1]}));
  if (DR.result){
    card.append(h("div", {class:"bs", text: x[0]}), speakBtn("Anhören", x[0], false), diffView(DR.result),
      h("div", {class:"row", style:"justify-content:center"}, h("button", {class:"btn ghost", type:"button", text:"Nochmal", onclick: () => { DR.result = null; render(); }}),
        h("button", {class:"btn", type:"button", text:"Weiter", onclick: () => { DR.i++; DR.result = null; render(); }})));
  } else {
    card.append(answerBox((t) => { countSpoken(); DR.result = compare(x[0], t); DR.score[DR.i] = DR.result.score; if (DR.result.score < 70) autoAdd({bs: x[0], de: x[1]}, "Satzbaukasten", true); render(); speak(x[0], false, null); }).box,
      h("button", {class:"tbtn", type:"button", text:"Lösung zeigen", onclick: () => { DR.result = {words: normWords(x[0]).map(w => ({w, s:"miss"})), score: 0}; DR.score[DR.i] = 0; autoAdd({bs: x[0], de: x[1]}, "Satzbaukasten", true); render(); speak(x[0], false, null); }}));

/* ---------- exchange codes & backup ---------- */
function b64encode(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* reads both kinds of code: PRICAJ: (sentence list from the Claude version) and PRICAJ-SICHERUNG: (full backup) */
function parseCode(code){
  const raw = String(code || "").replace(/\s+/g, "");
  const m = raw.match(/PRICAJ(-SICHERUNG)?:([A-Za-z0-9+/=_-]+)/);
  if (!m) throw new Error("Kein gültiger Code. Er beginnt mit PRICAJ: oder PRICAJ-SICHERUNG:");
  let data;
  try{ data = JSON.parse(b64decode(m[2])); }catch(e){ throw new Error("Der Code ist unvollständig. Bitte komplett kopieren."); }
  if (m[1]){
    if (!data || data.kind !== "backup" || !data.data) throw new Error("Die Sicherung ist beschädigt.");
    return {kind:"backup", at: data.at, data: data.data};
  }
  if (!data || !Array.isArray(data.items)) throw new Error("Der Code enthält keine Sätze.");
  return {kind:"items", items: data.items};
}
function importItems(items){
  let n = 0;
  for (const it of items){
    if (!it || !it.bs) continue;
    const ex = findVocab(it.bs);
    if (ex){ if (it.p && !ex.personal){ ex.personal = true; n++; } continue; }
    autoAdd({bs: it.bs, de: it.de || "", laut: it.laut || "", personal: !!it.p}, it.p ? "Über mich" : "Claude-Version", false); n++;
  }
  save(); return n;
}
/* merge a backup into the current data: nothing already here gets lost */
function mergeBackup(d){
  const r = {vocab:0, days:0, etappen:0};
  const fresh = !S.profile.onboarded;
  if (d.profile && typeof d.profile === "object"){
    if (fresh){ S.profile = Object.assign(freshProfile(), d.profile); S.profile.settings = Object.assign({...DEFAULT_SETTINGS}, d.profile.settings || {}); S.profile.onboarded = true; }
    else {
      if (!S.profile.name && d.profile.name) S.profile.name = clip(d.profile.name, 40);
      S.profile.lastBackup = Math.max(S.profile.lastBackup || 0, d.profile.lastBackup || 0) || undefined;
    }
  }
  for (const v of Object.values(d.vocab || {})){
    if (!v || !v.bs) continue;
    const ex = findVocab(v.bs);
    if (!ex){
      const id = newId();
      S.vocab[id] = {id, bs: clip(v.bs, 200), de: clip(v.de, 200), laut: clip(v.laut || bsToLaut(v.bs), 200), box: v.box || 1, due: v.due || Date.now(), added: v.added || Date.now(), src: v.src || "", personal: !!v.personal};
      r.vocab++;
    } else {
      if ((v.box || 1) > (ex.box || 1)){ ex.box = v.box; ex.due = v.due; }
      if (v.personal) ex.personal = true;
      if (!ex.de && v.de) ex.de = v.de;
    }
  }
  for (const [k, x] of Object.entries(d.days || {})){
    if (!x) continue;
    const cur = S.days[k];
    if (!cur){ S.days[k] = {sec: x.sec || 0, spoken: x.spoken || 0}; r.days++; }
    else { cur.sec = Math.max(cur.sec || 0, x.sec || 0); cur.spoken = Math.max(cur.spoken || 0, x.spoken || 0); }
  }
  for (const [id, when] of Object.entries((d.path && d.path.done) || {})){
    if (!S.path.done[id]){ S.path.done[id] = when; r.etappen++; }
  }
  store.set("pricaj-app", S); applyBodyClasses();
  return r;
}
function applyCode(code){
  const c = parseCode(code);
  if (c.kind === "items"){ const n = importItems(c.items); return n ? `${n} Einträge übernommen.` : "Alles war schon im Heft."; }
  const r = mergeBackup(c.data);
  const parts = [r.vocab ? `${r.vocab} Einträge` : "", r.etappen ? `${r.etappen} Etappen` : "", r.days ? `${r.days} Lerntage` : ""].filter(Boolean);
  return parts.length ? `Sicherung eingespielt: ${parts.join(", ")} dazugekommen.` : "Sicherung eingespielt. Es war schon alles da.";
}
function backupCode(){ return "PRICAJ-SICHERUNG:" + b64encode(JSON.stringify({v:1, kind:"backup", at: Date.now(), data: {profile: S.profile, vocab: S.vocab, days: S.days, path: S.path}})); }
function markBackup(){ S.profile.lastBackup = Date.now(); save(); }
const daysSince = (t) => Math.floor((startOfDay(Date.now()) - startOfDay(t)) / DAY);
function backupAge(){
  const t = S.profile.lastBackup;
  if (!t) return "Noch keine Sicherung.";
  const d = daysSince(t);
  return `Letzte Sicherung: ${d === 0 ? "heute" : d === 1 ? "gestern" : `vor ${d} Tagen`}.`;
}
async function shareBackup(){
  const code = backupCode(), name = `pricaj-sicherung-${dayKey()}.txt`;
  try{
    const file = new File([code], name, {type:"text/plain"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Pričaj-Sicherung"});
      markBackup(); toast("Gesichert."); render(); return;
    }
    if (navigator.share){ await navigator.share({title:"Pričaj-Sicherung", text: code}); markBackup(); toast("Gesichert."); render(); return; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  copyBackup();
}
function copyBackup(){
  const code = backupCode();
  const done = () => { markBackup(); toast("Code kopiert. Füg ihn z. B. in eine Notiz ein."); render(); };
  try{
    navigator.clipboard.writeText(code).then(done, () => showCode(code));
  }catch(e){ showCode(code); }
}
function showCode(code){
  const box = document.getElementById("backupOut"); if (!box) return;
  box.textContent = "";
  const ta = h("textarea", {class:"textin", rows:"4", readonly:"readonly", style:"font-size:.75rem"}); ta.value = code;
  box.append(h("p", {class:"muted small", text:"Kopieren ging nicht automatisch: Text lange drücken, „Alles auswählen“, dann „Kopieren“."}), ta);
  ta.focus(); ta.select(); markBackup();
}
function restoreBox(opts){
  opts = opts || {};
  const ta = h("textarea", {class:"textin", rows:"3", placeholder:"Code hier einfügen (beginnt mit PRICAJ)", style:"resize:vertical"});
  const file = h("input", {type:"file", accept:".txt,.json,text/plain,application/json", style:"display:none"});
  const run = (text) => {
    try{ const msg = applyCode(text); toast(msg); ta.value = ""; if (opts.onDone) opts.onDone(); else render(); }
    catch(e){ toast(e.message || "Der Code ließ sich nicht lesen."); }
  };
  file.addEventListener("change", async () => { const f = file.files && file.files[0]; if (!f) return; try{ run(await f.text()); }catch(e){ toast("Die Datei ließ sich nicht lesen."); } file.value = ""; });
  return h("details", {class:"card", open: opts.open ? "open" : null}, h("summary", {text: opts.title || "Sicherung oder Code einspielen"}), h("div", {class:"stack"},
    h("p", {class:"muted small", text: opts.help || "Eine Sicherungsdatei wählen oder einen Code einfügen. Bestehende Daten bleiben erhalten, nur Neues kommt dazu."}),
    h("button", {class:"btn sec", type:"button", text:"Sicherungsdatei wählen", onclick: () => file.click()}), file,
    ta, h("button", {class:"btn", type:"button", text:"Einspielen", onclick: () => run(ta.value)})));
}
function importBox(){
  return restoreBox({title:"Sätze aus der Claude-Version übernehmen", help:"In der Claude-Version unter „Sprechen → Sätze über mich“ oder im Heft auf „Für die iPhone-App kopieren“ tippen, dann hier einfügen. Eine Sicherung kannst du hier ebenfalls einspielen."});
}
function backupCard(){
  return h("section", {class:"card set"}, h("h3", {text:"Sicherung"}),
    h("p", {class:"muted small", text:"Deine Daten liegen nur in dieser App auf diesem iPhone. Löschst du das Symbol, sind sie weg. Eine Sicherung enthält Heft, Lernpfad, Lerntage und Einstellungen."}),
    h("p", {style:"font-weight:600", text: backupAge()}),
    h("div", {class:"row"}, h("button", {class:"btn", type:"button", text:"Sicherung speichern", onclick: shareBackup}), h("button", {class:"btn ghost", type:"button", text:"Als Code kopieren", onclick: copyBackup})),
    h("p", {class:"muted small", text:"„Sicherung speichern“ öffnet das Teilen-Menü: „In Dateien sichern“ legt eine kleine Textdatei ab, z. B. in iCloud Drive."}),
    h("div", {id:"backupOut", class:"stack"}),
    restoreBox());
}

/* ================= boot ================= */
applyBodyClasses();
loadVoices();
if (synth) try{ synth.addEventListener("voiceschanged", () => { const had = canSpeak(); loadVoices(); if (had !== canSpeak() && !["quiz","numbers","shadow","cards"].includes(view)) render(); }); }catch(e){}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden"){ clearTimeout(saveTimer); store.set("pricaj-app", S); } });
render();
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then((reg) => {
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "activated" && hadController){
          const t = $("toast"); t.hidden = false; t.textContent = "";
          t.append("Neue Version da. ", h("button", {class:"tbtn", type:"button", style:"margin-left:6px;color:var(--fg)", text:"Jetzt laden", onclick: () => location.reload()}));
          clearTimeout(toastTimer);
        }
      });
    });
  }).catch(() => {});
}
})();
