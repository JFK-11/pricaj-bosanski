<title>Pričaj bosanski</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: phone-first app — header, scrolling view, bottom tab bar (or composer in practice views). Flag blue + gold. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#e8ebf4; --line:#d5dae8;
  --fg:#151a2e; --muted:#5b6380; --accent:#2340a8; --accent-ink:#ffffff; --accent-soft:#e2e7f8;
  --gold:#e3a915; --gold-soft:#fbefc9; --gold-ink:#1b1500; --ok:#1d7a4f; --ok-soft:#dcf1e6; --warn:#8a5f00; --bad:#b3372f; --bad-soft:#f8e1de;
  --shade:rgba(15,20,40,.45);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --surface:#171d33; --surface-2:#20284a; --line:#2c355c;
  --fg:#e8eaf4; --muted:#9aa2c2; --accent:#8da2f5; --accent-ink:#0e1220; --accent-soft:#232c55;
  --gold:#f2c552; --gold-soft:#3a3214; --gold-ink:#1b1500; --ok:#6fd3a0; --ok-soft:#163327; --warn:#e8c066; --bad:#f08a80; --bad-soft:#3d1d1b;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#171d33; --surface-2:#20284a; --line:#2c355c;
  --fg:#e8eaf4; --muted:#9aa2c2; --accent:#8da2f5; --accent-ink:#0e1220; --accent-soft:#232c55;
  --gold:#f2c552; --gold-soft:#3a3214; --gold-ink:#1b1500; --ok:#6fd3a0; --ok-soft:#163327; --warn:#e8c066; --bad:#f08a80; --bad-soft:#3d1d1b;
  --shade:rgba(0,0,0,.6); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.app{height:100%;max-width:720px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible,.word:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.cap{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* header */
.hdr{display:flex;align-items:center;gap:8px;padding-block:12px 10px;min-height:56px;border-bottom:1px solid var(--line)}
.hdr .ttl{flex:1;min-width:0}
.hdr h1{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.hdr h1 span{color:var(--accent)}
.hdr .sub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;flex:none}

/* main */
.main{overflow-y:auto;min-height:0;padding-block:16px 20px;display:grid;grid-auto-rows:max-content;gap:18px;align-content:start}
.main.chatmode{padding-block:14px}

/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-block:6px 4px}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:.74rem;color:var(--muted);font-weight:600}
.tabs svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* cards & blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface-2);color:var(--fg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:17px;height:17px}
.btn.block{width:100%}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.pill svg{width:15px;height:15px}
.pill.playing{border-color:var(--gold);background:var(--gold-soft)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:.9rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.field{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px;gap:6px;min-width:0}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none}
.textin{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:none}
.textin:focus{border-color:var(--accent)}
.note{font-size:.88rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:9px 11px}
.empty{color:var(--muted);text-align:center;padding:18px 8px}

/* home */
.hello h2{font-size:1.9rem;letter-spacing:-.015em}
.hello p{color:var(--muted);margin-top:2px}
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .6s}
.ring.done .val{stroke:var(--gold)}
.ring text{fill:var(--fg);font-family:var(--display);font-weight:700}
.ring .unit{fill:var(--muted);font-family:var(--body);font-weight:400}
.stats{display:grid;gap:4px}
.stats b{font-family:var(--display);font-size:1.15rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin-top:4px}
.week .col{display:grid;gap:4px;justify-items:center;align-self:stretch;grid-template-rows:1fr auto}
.week .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--surface-2);align-self:end;min-height:4px}
.week .bar.hit{background:var(--accent)}
.week .bar.now{outline:2px solid var(--gold);outline-offset:1px}
.week span{font-size:.72rem;color:var(--muted);font-weight:600}
.action{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;gap:3px;align-content:start}
.action:hover{border-color:var(--accent)}
.action b{font-family:var(--display);font-size:1.02rem}
.action small{color:var(--muted);font-size:.84rem;line-height:1.3}
.action .badge{justify-self:start;background:var(--gold-soft);color:var(--warn);border-radius:999px;font-size:.75rem;font-weight:600;padding:1px 8px;margin-top:3px}
.resume{display:grid;gap:6px;border-color:var(--accent);background:var(--accent-soft)}
.resume .bsline{font-family:var(--display);font-size:1.1rem}

/* scenarios */
.scen{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;align-content:start}
.scen:hover{border-color:var(--accent)}
.scen b{font-family:var(--display);font-size:1.02rem;font-weight:600;line-height:1.2}
.scen span{font-size:.88rem;font-weight:600;color:var(--accent)}
.scen small{color:var(--muted);font-size:.82rem;line-height:1.3}
.list{display:grid;gap:8px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow-wrap:anywhere}
.li .grow small{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.boxdots{display:inline-flex;gap:3px;margin-top:4px}
.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.boxdots i.on{background:var(--ok)}

/* chat */
.chat{display:grid;gap:14px}
.msg{max-width:90%;min-width:0;display:grid;gap:6px}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px;padding:9px 13px;overflow-wrap:anywhere}
.msg.me .via{font-size:.72rem;opacity:.8}
.grade{justify-self:end;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:-8px}
.grade.richtig{background:var(--ok-soft);color:var(--ok)}
.grade.fast{background:var(--gold-soft);color:var(--warn)}
.grade.falsch{background:var(--bad-soft);color:var(--bad)}
.grade.deutsch{background:var(--surface-2);color:var(--muted)}
.msg.tutor{justify-self:start;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:11px 13px}
.fix{background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:.92rem;display:grid;gap:3px}
.fix .cap{color:var(--warn)}
.fix s{opacity:.7}
.bs{font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.word{cursor:pointer;border-radius:4px;text-decoration:underline dotted color-mix(in srgb, var(--muted) 60%, transparent);text-underline-offset:4px;text-decoration-thickness:1.5px}
.word:hover,.word.sel{background:var(--accent-soft)}
.laut{font-size:.92rem;color:var(--accent);font-style:italic;overflow-wrap:anywhere}
.de{font-size:.92rem;color:var(--muted)}
body.hide-laut .laut, body.hide-de .de{display:none}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.sugg{display:grid;gap:6px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
.chip{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;display:grid;gap:1px}
.chip b{font-weight:600}
.chip small{color:var(--muted)}
body.hide-de .chip small{display:none}
.msg.err{justify-self:start;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:.92rem}
.msg.err button{margin-top:6px;border:1px solid currentColor;background:transparent;border-radius:999px;padding:4px 12px;font-size:.88rem;color:inherit;justify-self:start}
.typing{justify-self:start;display:flex;gap:5px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* composer */
.composer{border-top:1px solid var(--line);padding-block:8px 10px;display:grid;gap:7px}
.helpers{display:flex;gap:6px;flex-wrap:wrap}
.live{font-size:.95rem;color:var(--muted);font-style:italic}
.keys{display:none;gap:6px;flex-wrap:wrap}
.composer:focus-within .keys,.answer:focus-within .keys{display:flex}
.keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;padding:5px 8px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px}
.bar .field{flex:1;border-radius:999px}
.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px}
.mic{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;position:relative;transition:background .15s}
.mic svg{width:25px;height:25px}
.mic[data-state="listening"],.mic[data-state="starting"],.mic[data-state="finishing"]{background:var(--gold);color:var(--gold-ink)}
.mic[data-state="listening"]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--gold);animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.mic[hidden]{display:none}
.hint{font-size:.8rem;color:var(--muted);text-align:center}

/* practice cards */
.prog{display:flex;gap:5px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.prog i.done{background:var(--accent)}
.prog i.cur{background:var(--gold)}
.practice{display:grid;gap:12px;text-align:center;justify-items:center;padding:20px 14px}
.practice .bs{font-size:1.6rem}
.practice .de{font-size:1rem}
.veil{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);width:100%}
.answer{display:grid;gap:8px;width:100%}
.diff{font-family:var(--display);font-size:1.3rem;line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center}
.diff .ok{color:var(--ok)}
.diff .near{color:var(--warn);text-decoration:underline wavy;text-underline-offset:5px}
.diff .miss{color:var(--bad);text-decoration:line-through;opacity:.8}
.score{font-family:var(--display);font-size:2.2rem;font-weight:700}
.score.good{color:var(--ok)}.score.mid{color:var(--warn)}.score.low{color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;display:grid;gap:1px;font-weight:600}
.rate button small{font-weight:400;color:var(--muted);font-size:.78rem}
.rate .r1{border-color:var(--bad)} .rate .r2{border-color:var(--gold)} .rate .r3{border-color:var(--ok)}
.sound{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.sound .glyph{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--accent);text-align:center;line-height:1.1}
.sound .ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* settings form */
.set{display:grid;gap:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setrow label,.setrow .lbl{flex:1;min-width:0}
.setrow small{display:block;color:var(--muted);font-size:.8rem}
.switch{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:21px}
input[type=range]{accent-color:var(--accent);width:140px}
.val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:3.2em;text-align:right}
select.textin{width:auto}
.sync{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--ok)} .sync.error i{background:var(--bad)}

/* onboarding */
.onb{display:grid;gap:22px;padding-block:20px}
.onb h2{font-size:2.1rem;letter-spacing:-.02em}
.onb .lead{color:var(--muted);font-size:1.05rem}

/* quiz, numbers, words */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 10px;font-weight:600;font-size:1.08rem;min-height:68px;overflow-wrap:anywhere;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.quizhead{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.combo{color:var(--warn);font-weight:600}
.bignum{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.numgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;display:grid;gap:0;text-align:center}
.numgrid b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.numgrid small{color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
details.card > summary{cursor:pointer;font-weight:600;list-style-position:inside}
details.card[open] > summary{margin-bottom:10px}
.conj{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.95rem;margin-top:8px}
.conj span{color:var(--muted)}
.conj b{font-weight:600}
.wrow{display:grid;gap:3px}
.wrow .ex{font-size:.9rem;color:var(--muted)}
.wrow .ex b{color:var(--fg);font-weight:600}
.catgrid .scen b{font-size:1rem}

/* sheet & toast */
.shade{position:fixed;inset:0;background:var(--shade);z-index:30;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:82vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:grid;grid-auto-rows:max-content;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;width:max-content;max-width:min(90vw,460px);text-align:center;z-index:40}
@media (prefers-reduced-motion: reduce){.mic[data-state="listening"]::after,.typing i{animation:none}.ring .val{transition:none}}
</style>

<div class="app">
  <div class="hdr" id="hdr"></div>
  <main class="main" id="main"></main>
  <div id="bottom"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

/* ================= content ================= */
const SCENARIOS = [
  {id:"upoznavanje", bs:"Upoznavanje", de:"Kennenlernen", hint:"Name, Herkunft, Wohnort, Beruf",
   role:"Du bist eine freundliche Person in Sarajevo, die ihn gerade kennenlernt. Frag nach Name, Herkunft, Wohnort und Beruf."},
  {id:"kafana", bs:"U kafani", de:"Im Café", hint:"Bestellen, nachfragen, bezahlen",
   role:"Du bist Kellner in einer Kafana in Sarajevo, er ist Gast. Nimm die Bestellung auf (kafa, čaj, sok, kolači), am Ende wird bezahlt."},
  {id:"pijaca", bs:"Na pijaci", de:"Auf dem Markt", hint:"Obst, Gemüse, Mengen, Preise",
   role:"Du verkaufst Obst und Gemüse auf einer Pijaca, er kauft ein. Übe Zahlen, Mengen (kilo, pola kile) und Preise in KM."},
  {id:"grad", bs:"Po gradu", de:"Weg fragen", hint:"Richtungen, Orte, Tram",
   role:"Du bist Passant in Sarajevo, er fragt nach dem Weg (Baščaršija, stanica, apoteka, pošta). Übe lijevo, desno, pravo, blizu, daleko, tramvaj."},
  {id:"za-stolom", bs:"Za stolom", de:"Am Esstisch", hint:"Zu Gast, Essen loben, höflich ablehnen",

/* text comparison for repeat/answer checks */
const CYR = {"а":"a","б":"b","в":"v","г":"g","д":"d","ђ":"đ","е":"e","ж":"ž","з":"z","и":"i","ј":"j","к":"k","л":"l","љ":"lj","м":"m","н":"n","њ":"nj","о":"o","п":"p","р":"r","с":"s","т":"t","ћ":"ć","у":"u","ф":"f","х":"h","ц":"c","ч":"č","џ":"dž","ш":"š"};
function normWords(s){
  s = String(s || "").toLowerCase().normalize("NFC").replace(/[Ѐ-ӿ]/g, ch => CYR[ch] ?? ch);
  return s.replace(/[.,!?;:"„“”'’…()\[\]«»–—-]/g, " ").split(/\s+/).filter(Boolean);
}
const loose = (w) => w.replace(/[čć]/g, "c").replace(/dž/g, "dz").replace(/đ/g, "dj").replace(/š/g, "s").replace(/ž/g, "z");
function compare(target, said){
  const T = normWords(target), A = normWords(said), n = T.length, m = A.length;
  const dp = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = loose(T[i]) === loose(A[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const res = []; let i = 0, j = 0;
  while (i < n){
    if (j < m && loose(T[i]) === loose(A[j])){ res.push({w:T[i], s: T[i] === A[j] ? "ok" : "near"}); i++; j++; }
    else if (j < m && dp[i][j + 1] >= dp[i + 1][j]) j++;
    else { res.push({w:T[i], s:"miss"}); i++; }
  }
  const got = res.reduce((a, r) => a + (r.s === "ok" ? 1 : r.s === "near" ? 0.85 : 0), 0);
  return {words: res, score: n ? Math.round(got / n * 100) : 0};
}

        if (e && e.code === "unavailable"){ await sleep(700 + Math.random() * 900); try{ await go(); }catch(e2){ syncFail(e2); } }
        else syncFail(e);
      }
    }
    this.running = false;
  }
};
function syncFail(e){
  const c = e && e.code;
  if (c === "quota_exceeded"){ toast("Der Speicher im Konto ist voll. Lösche alte Gespräche im Heft."); return; }
  if (c === "resource_exhausted") return;
  db = null; writer.pending.clear(); setSync("error");
  toast("Speichern im Konto klappt gerade nicht. Deine Daten bleiben auf diesem Gerät.");
}
const vocabRef = (id) => rootRef && rootRef.collection("vocab").doc(id);
const convRef = (id) => rootRef && rootRef.collection("convs").doc(id);
const dayRef = (k) => rootRef && rootRef.collection("days").doc(k);
function persistProfile(){ S.profile.upd = Date.now(); saveLocal(); if (db) writer.put(rootRef, JSON.parse(JSON.stringify(S.profile))); }
function persistVocab(id){ saveLocal(); if (db) writer.put(vocabRef(id), S.vocab[id] ? {...S.vocab[id]} : null); }
function trimConv(c){ return {...c, msgs: c.msgs.slice(-80), turns: c.turns.slice(-40)}; }
function persistConv(id){
  const c = S.convs[id];
  if (c){ c.msgs = c.msgs.slice(-80); c.turns = c.turns.slice(-40); }
  saveLocal(); if (db) writer.put(convRef(id), c ? JSON.parse(JSON.stringify(trimConv(c))) : null);
}
function persistDay(k){ saveLocal(); if (db && S.days[k]) writer.put(dayRef(k), {...S.days[k], d:k}); }

async function loadCloud(){
  if (!db || !rootRef) return;
  setSync("loading");
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; if (syncState === "loading") setSync("offline"); }, 10000);
  try{
    const root = await rootRef.get();
    if (!root.exists){
      clearTimeout(timer);
      writer.put(rootRef, JSON.parse(JSON.stringify(S.profile)));
      for (const id in S.vocab) persistVocab(id);
      for (const id in S.convs) persistConv(id);
      for (const k in S.days) persistDay(k);
      setSync("cloud"); return;
    }
    const [v, c, d] = await Promise.all([
      rootRef.collection("vocab").limit(1000).get(),
      rootRef.collection("convs").orderBy("upd", "desc").limit(40).get(),
      rootRef.collection("days").orderBy("d", "desc").limit(120).get()
    ]);
    clearTimeout(timer);
    const cp = root.data() || {};
    if ((cp.upd || 0) >= (S.profile.upd || 0)){
      S.profile = Object.assign(freshProfile(), cp);
      S.profile.settings = Object.assign({...DEFAULT_SETTINGS}, cp.settings || {});
    } else writer.put(rootRef, JSON.parse(JSON.stringify(S.profile)));
    mergeColl(S.vocab, v.docs, persistVocab);
    mergeColl(S.convs, c.docs, persistConv);
    const seen = new Set();
    for (const doc of d.docs){
      const x = doc.data() || {}; seen.add(doc.id);
      const l = S.days[doc.id];
      if (!l) S.days[doc.id] = {sec: x.sec || 0, spoken: x.spoken || 0};
      else if ((l.sec || 0) > (x.sec || 0) || (l.spoken || 0) > (x.spoken || 0)){ l.sec = Math.max(l.sec || 0, x.sec || 0); l.spoken = Math.max(l.spoken || 0, x.spoken || 0); persistDay(doc.id); }
      else { l.sec = x.sec || 0; l.spoken = x.spoken || 0; }
    }
    for (const k in S.days) if (!seen.has(k) && k >= dayKey(new Date(Date.now() - 119 * DAY))) persistDay(k);
    saveLocal(); setSync("cloud"); applyBodyClasses(); rerender();
  }catch(e){
    clearTimeout(timer);
    if (!timedOut) syncFail(e);
  }
}
function mergeColl(local, docs, persist){
  const seen = new Set();
  for (const doc of docs){
    const x = doc.data(); if (!x) continue; seen.add(doc.id);
    const l = local[doc.id];
    if (!l || (x.upd || 0) >= (l.upd || 0)) local[doc.id] = JSON.parse(JSON.stringify(x));
    else persist(doc.id);
  }
  for (const id in local) if (!seen.has(id)) persist(id);
}

function markPlaying(btn){ if (playingBtn) playingBtn.classList.remove("playing"); playingBtn = btn || null; if (playingBtn) playingBtn.classList.add("playing"); }
function stopSpeaking(){
  if (tts) tts.stop().catch(() => {});
  else if (window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){}

function speak(text, slow, btn){
  if (!text) return;
  lastAct = Date.now();
  const rate = slow ? 0.7 : ST().rate;
  if (tts){
    if (dict && dict.active()){ toast("Erst das Mikrofon beenden, dann anhören."); return; }
    markPlaying(btn);
    const opts = {rate}; if (ttsLang) opts.language = ttsLang;

      if (playingBtn === btn) markPlaying(null);
      const c = e && e.code;
      if (c === "not_granted" || c === "unavailable"){ tts = null; ttsBlocked = c === "not_granted"; rerender(); if (c === "not_granted") toast("Vorlesen ist für diese Seite ausgeschaltet."); }
      else if (c === "busy") toast("Erst das Mikrofon beenden, dann anhören.");
      else if (c === "no_gesture") toast("Tippe nochmal auf Anhören.");
      else if (c === "rate_limited") toast("Gerade zu viel vorgelesen. Gleich nochmal versuchen.");
      else if (c !== "stopped") toast("Vorlesen hat nicht geklappt.");
    });
    return;
  }
  if (sysVoice && !ttsBlocked){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = sysVoice; u.lang = sysVoice.lang; u.rate = rate;
      u.onend = u.onerror = () => { if (playingBtn === btn) markPlaying(null); };
      markPlaying(btn); speechSynthesis.speak(u);
    }catch(e){ markPlaying(null); }
  }
}

let micTarget = null, micBuffer = "", micState = "idle";
function micBtn(target){
  const b = h("button", {class:"mic", type:"button", "aria-label":"Sprechen", html: I.mic});
  b.hidden = !dict; b.dataset.state = micState;
  b.addEventListener("click", () => micClick(target));

function micClick(target){
  if (!dict) return;
  if (dict.active()){ dict.stop().catch(() => {}); return; }
  micTarget = target; micBuffer = target.input.value;
  const p = dict.start({language: DICT_LANGS[P().dictLang] || "bs"});   // synchronous from the click
  stopSpeaking();
  p.catch(onStartError);
}
function onStartError(e){
  const c = e && e.code;
  if (c === "unavailable"){
    if (P().dictLang < DICT_LANGS.length - 1){
      const from = LANG_NAME[DICT_LANGS[P().dictLang]];
      P().dictLang++; persistProfile();
      toast(`${from} bietet die Spracherkennung nicht an. Ich nehme jetzt ${LANG_NAME[DICT_LANGS[P().dictLang]]}, das klingt fast gleich. Tippe nochmal aufs Mikrofon.`);
      updateHint();
    } else { dict = null; toast("Die Spracherkennung bietet hier keine passende Sprache an. Nutze das Diktat deiner Tastatur."); rerender(); }
  } else if (c === "not_granted"){ dict = null; toast("Mikrofon ist für diese Seite aus. Einschalten kannst du es im Berechtigungsmenü des Artifacts."); rerender(); }
  else if (c === "dismissed") toast("Mikrofon-Frage geschlossen. Tippe nochmal, wenn du sprechen willst.");
  else if (c === "rate_limited") toast("Gerade zu viele Aufnahmen. Gleich nochmal versuchen.");
  else if (c !== "stopped") toast("Das Mikrofon hat nicht reagiert. Versuch es nochmal.");
}
function wireDictation(d){
  d.onPartial(({text}) => { lastAct = Date.now(); if (micTarget && micTarget.live){ micTarget.live.textContent = text; micTarget.live.hidden = !text; } });
  d.onFinal(({text}) => {
    if (!micTarget) return;
    micBuffer = micBuffer ? micBuffer + text : text.replace(/^\s+/, "");
    micTarget.input.value = micBuffer; micTarget.fromMic = true;
    micTarget.input.dispatchEvent(new Event("input", {bubbles:true}));
  });
  d.onState(({state, reason}) => {
    micState = state;
    document.querySelectorAll(".mic").forEach(b => { b.dataset.state = state; b.setAttribute("aria-label", state === "idle" ? "Sprechen" : "Aufnahme beenden"); });
    updateHint();
    if (state === "idle"){
      const t = micTarget;
      if (t && t.live) t.live.hidden = true;
      if (t && (reason === "stopped" || reason === "viewer_stopped") && t.fromMic && t.input.value.trim() && document.contains(t.input)){
        if (ST().autoSend && t.onDone) t.onDone(); else t.input.focus();
      }
      else if (reason === "upstream_error") toast("Spracherkennung unterbrochen. Was erkannt wurde, steht im Textfeld.");
    }
  });
}
function updateHint(){
  const el = document.querySelector("[data-hint]"); if (!el) return;
  el.textContent = !dict ? (ST().keyboardSpoken ? "Tipp: Sprich über das Mikrofon deiner Tastatur (Sprache Kroatisch oder Bosnisch)." : "Schreiben oder über die Tastatur diktieren.") :
    micState === "listening" ? "Ich höre zu. Antippen, wenn du fertig bist." :
    micState === "starting" ? "Mikrofon startet …" :
    micState === "finishing" ? "Einen Moment …" :
    `Mikrofon antippen und sprechen · Erkennung: ${LANG_NAME[DICT_LANGS[P().dictLang]]}`;
}
function diacriticKeys(input){

  for (const k of ["č","ć","dž","đ","š","ž"]){

      r.hinweis ? h("p", {class:"muted small", text: r.hinweis}) : null,

        saveBtn({bs: r.grundform || r.wort || word, de: r.de, laut: r.laut, src:"Wort"}))
    );
  }catch(e){ if (body.isConnected){ body.lastChild.textContent = sampleErrText(e && e.code); } }

function wordified(text){
  const wrap = h("div", {class:"bs"});
  for (const part of String(text).split(/(\s+)/)){
    if (!part) continue;
    if (/^\s+$/.test(part)){ wrap.append(part); continue; }
    const m = part.match(/^([^\p{L}]*)([\p{L}'’-]+)([^\p{L}]*)$/u);
    if (!m){ wrap.append(part); continue; }
    if (m[1]) wrap.append(m[1]);
    const w = h("span", {class:"word", tabindex:"0", role:"button", text: m[2], "aria-label": m[2] + " nachschlagen"});
    const open = () => lookupWord(m[2], text, w);
    w.addEventListener("click", open);
    w.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } });
    wrap.append(w);
    if (m[3]) wrap.append(m[3]);
  }
  return wrap;
}

  const act = (title, text, badge, fn) => h("button", {class:"action", type:"button", onclick: fn}, h("b", {text:title}), h("small", {text}), badge ? h("span", {class:"badge", text: badge}) : null);
  main.append(h("section", {class:"stack"}, h("span", {class:"cap", text:"Heute üben"}), h("div", {class:"grid2"},

    act("Quiz", "Ein Wort, vier Antworten, die richtige antippen", null, () => go("quiz")),
    act("Zahlen", "Hören, wählen, sagen, Preise in KM", null, () => go("numbers")),
    act("Grundwortschatz", "Fragewörter, Grundverben, Alltagswörter", null, () => go("words")),
    act("Wiederholen", vocabN ? `${vocabN} Einträge im Heft` : "Füllt sich, wenn du Wörter merkst", due ? `${due} fällig` : null, () => go("cards")),
    act("Nachsprechen", "Hören, nachsprechen, Abgleich Wort für Wort", null, () => go("shadow")))));
  if (caps && !dict) main.append(h("p", {class:"note", text: "In dieser Ansicht gibt es kein App-Mikrofon. Sprich stattdessen über das Mikrofon deiner Handy-Tastatur: Füge dort Kroatisch oder Bosnisch als Tastatursprache hinzu und tippe in einem Textfeld aufs Mikrofon. Am Computer in Chrome oder in der Claude-Desktop-App gibt es das eingebaute Mikrofon."}));
  if (caps && !sample) main.append(h("p", {class:"note", text:"Der Tutor ist in dieser Ansicht nicht erreichbar. Öffne die Seite in Claude, dann funktionieren Gespräche und Nachschlagen."}));
};

/* ---------- chat ---------- */
let chatCtl = null, chatBusy = false;
function startConversation(scen, custom){
  const id = newId(), now = Date.now();
  S.convs[id] = {id, scen: scen || null, custom: custom ? clip(custom, 160) : "", level: P().level, msgs: [], turns: [], ev: null, created: now, upd: now};
  const all = Object.values(S.convs).sort((a, b) => (b.upd || 0) - (a.upd || 0));
  for (const old of all.slice(30)){ delete S.convs[old.id]; persistConv(old.id); }
  go("chat", id);
}
function chatRules(c){
  const s = scenarioOf(c);
  return [
    "Du bist ein geduldiger Bosnisch-Tutor. Ihr übt mündliches Sprechen; der Lerner lernt vor allem über Hören und Nachsprechen.",
    aboutLearner(c.level),
    s ? "Thema und deine Rolle: " + s.role : `Thema, das er selbst gewählt hat: "${clip(c.custom, 160)}". Übernimm eine passende Rolle und führe ein realistisches Alltagsgespräch dazu.`,
    "Führe das Gespräch in der Rolle und ende fast jede Runde mit einer kurzen Frage, damit er antworten muss. Halte \"bs\" kurz: höchstens zwei kurze Sätze.",
    "Seine Nachrichten sind markiert: [gesprochen] kommt aus einer Spracherkennung (kann ohne Häkchen oder in Kyrillisch ankommen), [getippt] hat er selbst geschrieben, [hilfe] heißt, er versteht dich nicht oder weiß nicht weiter.",
    "Bei [gesprochen]: Wenn ein Wort erkennbar gemeint war, aber falsch erkannt wurde, ist das ein Hinweis auf die Aussprache. Nenne dann den Laut, den er üben soll (z. B. č gegen ć, h, rollendes r). Fehlende Häkchen nur ansprechen, wenn sie die Bedeutung ändern.",
    "Bei [hilfe]: Sag dein Anliegen einfacher, erkläre in \"de\" kurz auf Deutsch, worum es geht und was er antworten könnte, und gib besonders einfache Vorschläge. bewertung ist dann null.",
    "Korrigiere pro Runde höchstens einen Hauptfehler, kurz und auf Deutsch. Ist sein Satz korrekt und natürlich, ist korrektur null. Erfinde keine Fehler.",
    "Schreibt oder fragt er auf Deutsch (z. B. \"Wie sagt man …?\"), beantworte das in \"de\", gib den bosnischen Satz in \"bs\" und lade ihn ein, ihn nachzusprechen.",
    LAUT_RULES + " Die Lautschrift gilt für den Satz in \"bs\".",
    "\"vorschlaege\": 2 bis 3 kurze, natürliche Antworten, die er jetzt sagen könnte, passend zum Niveau.",
    "\"bewertung\" beurteilt seine letzte Nachricht: \"richtig\", \"fast\" (verständlich, kleiner Fehler), \"falsch\" (nicht verständlich oder falsch), \"deutsch\" (er hat Deutsch geschrieben) oder null (noch keine Nachricht von ihm, oder [hilfe]).",
    "Wenn noch kein Gespräch läuft, beginne mit einer Begrüßung in deiner Rolle und einer ersten einfachen Frage.",
    "Antworte NUR mit einem JSON-Objekt in genau dieser Form:",
    '{"bewertung": "richtig" | "fast" | "falsch" | "deutsch" | null, "korrektur": null | {"falsch": "sein Ausdruck", "richtig": "korrekte Form", "warum": "kurze Erklärung auf Deutsch"}, "bs": "was du auf Bosnisch sagst", "laut": "Lautschrift", "de": "deutsche Übersetzung", "vorschlaege": [{"bs": "...", "de": "..."}]}'
  ].join("\n");
}
async function askTutor(id){
  const c = S.convs[id]; if (!c) return;
  if (!sample){ if (caps) pushMsg(c, {who:"err", text:"Der Tutor ist in dieser Ansicht nicht erreichbar. Öffne die Seite in Claude.", retry:false}); return; }
  if (chatCtl) chatCtl.abort();
  const my = new AbortController(); chatCtl = my; chatBusy = true;
  if (view === "chat" && arg === id){ renderChatList(); updateSendBtn(); }
  try{
    const input = [{role:"user", content: chatRules(c)}, ...c.turns.slice(-24)];
    const data = await sample.json(input, {cache:false, signal: my.signal, modelTier: tier()});
    if (my !== chatCtl) return;
    if (!data || typeof data.bs !== "string" || !data.bs.trim()) throw {code:"invalid_json"};
    c.turns.push({role:"assistant", content: JSON.stringify(data)});
    for (let i = c.msgs.length - 1; i >= 0; i--){ const m = c.msgs[i]; if (m.who === "me"){ if (data.bewertung) m.grade = data.bewertung; break; } if (m.who === "tutor") break; }
    chatBusy = false;
    pushMsg(c, {who:"tutor", data});
    if (ST().speak && canSpeak() && view === "chat" && arg === id && !(dict && dict.active())){
      const bubbles = document.querySelectorAll(".msg.tutor"); const last = bubbles[bubbles.length - 1];
      speak(data.bs, false, last ? last.querySelector(".pill") : null);
    }
  }catch(e){
    if (my !== chatCtl) return;
    chatBusy = false;
    const code = e && e.code;
    if (code === "cancelled"){ if (view === "chat") renderChatList(); return; }
    pushMsg(c, {who:"err", text: sampleErrText(code), retry: !["not_granted","sampling_disabled","session_expired","refused"].includes(code)});
  }finally{
    if (my === chatCtl){ chatCtl = null; chatBusy = false; if (view === "chat"){ const t = $("typing"); if (t) t.remove(); updateSendBtn(); } }
  }
}
function pushMsg(c, m){ c.msgs.push(m); c.upd = Date.now(); persistConv(c.id); if (view === "chat" && arg === c.id) renderChatList(); }
function sendChat(text, via){
  const c = S.convs[arg]; text = (text || "").trim();
  if (!c || !text || chatBusy) return;
  const last = c.msgs[c.msgs.length - 1]; if (last && last.who === "err") c.msgs.pop();
  if (via === "mic") countSpoken();
  c.msgs.push({who:"me", text, via});
  c.turns.push({role:"user", content: `[${via === "mic" ? "gesprochen" : "getippt"}] ${text}`});
  c.upd = Date.now(); persistConv(c.id); renderChatList();
  askTutor(c.id);
}
function sendHelp(){
  const c = S.convs[arg]; if (!c || chatBusy) return;
  c.msgs.push({who:"me", text:"Hilfe, ich verstehe nicht", via:"help"});
  c.turns.push({role:"user", content:"[hilfe]"});
  c.upd = Date.now(); persistConv(c.id); renderChatList(); askTutor(c.id);
}
let chatTarget = null;
function updateSendBtn(){ const b = $("sendBtn"); if (b && chatTarget) b.disabled = chatBusy || !chatTarget.input.value.trim(); }
VIEWS.chat = (hdr, main, bottom) => {
  const c = S.convs[arg];
  if (!c){ view = "talk"; return VIEWS.talk(hdr, main, bottom); }

    {back:true, right: h("button", {class:"tbtn", type:"button", text:"Auswerten", onclick: () => evaluateConv(c)})});
  main.classList.add("chatmode");
  main.append(h("section", {class:"chat", id:"chat"}));
  const input = h("input", {id:"chatText", placeholder: dict ? "Schreiben oder Mikrofon antippen" : "Schreiben oder diktieren", "aria-label":"Deine Antwort", autocomplete:"off"});
  const live = h("div", {class:"live", hidden:true});
  chatTarget = {input, live, fromMic:false, onDone: () => submit()};
  const submit = () => { const via = spokenVia(chatTarget); chatTarget.fromMic = false; const t = input.value; input.value = ""; updateSendBtn(); sendChat(t, via); };
  input.addEventListener("input", (e) => { if (e.isTrusted) chatTarget.fromMic = chatTarget.fromMic && !!input.value; updateSendBtn(); });
  const form = h("form", {class:"field", autocomplete:"off"}, input, h("button", {class:"send", id:"sendBtn", type:"submit", "aria-label":"Senden", html: I.send, disabled:true}));
  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  bottom.append(h("div", {class:"composer"},
    h("div", {class:"helpers"}, h("button", {class:"pill", type:"button", text:"Hilfe, ich verstehe nicht", onclick: sendHelp})),
    live, diacriticKeys(input),
    h("div", {class:"bar"}, form, micBtn(chatTarget)),
    h("div", {class:"hint", "data-hint":""})));
  renderChatList();
  const lastTurn = c.turns[c.turns.length - 1], lastMsg = c.msgs[c.msgs.length - 1];
  if (!chatBusy && (!lastTurn || lastTurn.role === "user") && !(lastMsg && lastMsg.who === "err")) askTutor(c.id);
};
function renderChatList(){
  const list = $("chat"); const c = S.convs[arg]; if (!list || !c) return;
  list.textContent = "";
  const lastTutor = c.msgs.map(m => m.who).lastIndexOf("tutor");
  c.msgs.forEach((m, i) => list.append(...renderMsg(c, m, i, i === lastTutor)));
  if (chatBusy){ const t = h("div", {class:"typing", id:"typing"}, h("i"), h("i"), h("i")); list.append(t); }
  if (!c.msgs.length && !chatBusy) list.append(h("p", {class:"empty", text:"Der Tutor beginnt gleich."}));
  requestAnimationFrame(() => { const mn = $("main"); mn.scrollTop = mn.scrollHeight; });
}
function renderMsg(c, m, idx, isLastTutor){
  if (m.who === "me"){
    const b = h("div", {class:"msg me"}, h("div", {text:m.text}), m.via === "mic" ? h("div", {class:"via", text:"gesprochen"}) : null);
    const label = {richtig:"Passt", fast:"Fast richtig", falsch:"Nochmal üben", deutsch:"Auf Deutsch"}[m.grade];
    return label ? [b, h("div", {class:"grade " + m.grade, text: label})] : [b];
  }
  if (m.who === "err"){
    const b = h("div", {class:"msg err"}, h("div", {text:m.text}));
    if (m.retry && idx === c.msgs.length - 1) b.append(h("button", {type:"button", text:"Nochmal versuchen", onclick: () => { c.msgs.pop(); persistConv(c.id); askTutor(c.id); }}));
    return [b];
  }
  const d = m.data, b = h("div", {class:"msg tutor"});
  if (d.korrektur && d.korrektur.richtig){
    b.append(h("div", {class:"fix"}, h("span", {class:"cap", text:"Besser so"}),
      h("div", null, d.korrektur.falsch ? [h("s", {text: d.korrektur.falsch}), " → "] : null, h("b", {text: d.korrektur.richtig})),
      d.korrektur.warum ? h("div", {text: d.korrektur.warum}) : null,
      h("div", {class:"actions"}, speakBtn("Anhören", d.korrektur.richtig, true), saveBtn({bs: d.korrektur.richtig, de: d.korrektur.warum || "", laut:"", src:"Korrektur"}))));
  }
  b.append(wordified(d.bs));
  if (d.laut) b.append(h("div", {class:"laut", text: d.laut}));
  if (d.de) b.append(h("div", {class:"de", text: d.de}));
  b.append(h("div", {class:"actions"}, speakBtn("Anhören", d.bs, false), speakBtn("Langsam", d.bs, true), saveBtn({bs: d.bs, de: d.de, laut: d.laut, src:"Gespräch"})));
  if (isLastTutor && Array.isArray(d.vorschlaege) && d.vorschlaege.length){
    const s = h("div", {class:"sugg"}, h("span", {class:"cap", text: canSpeak() ? "So könntest du antworten · antippen zum Anhören" : "So könntest du antworten · antippen zum Übernehmen"}));
    for (const v of d.vorschlaege.slice(0, 3)){
      if (!v || !v.bs) continue;
      const chip = h("button", {class:"chip", type:"button"}, h("b", {text: v.bs}), v.de ? h("small", {text: v.de}) : null);
      chip.onclick = () => { if (canSpeak()) speak(v.bs, false, null); else if (chatTarget){ chatTarget.input.value = v.bs; updateSendBtn(); } };
      s.append(chip);
    }
    b.append(s);
  }
  return [b];
}
async function evaluateConv(c){
  const mine = c.msgs.filter(m => m.who === "me" && m.via !== "help");
  const body = h("div", {class:"stack"}, h("h2", {text:"Auswertung"}));
  openSheet(body);
  if (c.ev){ fillEval(body, c, c.ev); return; }
  if (!mine.length){ body.append(h("p", {class:"muted", text:"Sag erst etwas zum Tutor, dann gibt es eine Auswertung."})); return; }
  if (!sample){ body.append(h("p", {class:"muted", text:"Die Auswertung geht nur, wenn die Seite in Claude geöffnet ist."})); return; }
  const status = h("p", {class:"muted", text:"Claude wertet das Gespräch aus …"}); body.append(status);
  const lines = c.msgs.filter(m => m.who === "me" || m.who === "tutor").slice(-40).map(m => m.who === "me" ? `Lerner${m.via === "mic" ? " (gesprochen)" : ""}: ${m.via === "help" ? "[bittet um Hilfe]" : m.text}` : `Tutor: ${m.data.bs}`).join("\n");
  try{
    const r = await sample.json(
      `Werte dieses Übungsgespräch auf Bosnisch aus. ${aboutLearner(c.level)}\n${LAUT_RULES}\n\nGespräch:\n${lines}\n\n` +
      'Antworte nur mit JSON: {"fazit": "2 bis 3 sachliche Sätze auf Deutsch: was klappte und was er als Nächstes üben sollte", "fehler": [{"falsch": "...", "richtig": "...", "warum": "kurz auf Deutsch"}], "woerter": [{"bs": "...", "de": "...", "laut": "..."}]}. Höchstens 4 Fehler (nur echte, keine erfundenen; leer, wenn keine) und höchstens 6 nützliche Wörter oder Wendungen aus dem Gespräch.',
      {cache:false, modelTier:"default"});
    if (!r || typeof r.fazit !== "string") throw {code:"invalid_json"};
    c.ev = {fazit: r.fazit, fehler: Array.isArray(r.fehler) ? r.fehler.slice(0, 4) : [], woerter: Array.isArray(r.woerter) ? r.woerter.slice(0, 6) : [], at: Date.now()};
    c.upd = Date.now(); persistConv(c.id);
    if (body.isConnected){ status.remove(); fillEval(body, c, c.ev); }
  }catch(e){ if (body.isConnected) status.textContent = sampleErrText(e && e.code); }
}
function fillEval(body, c, ev){
  body.append(h("p", {text: ev.fazit}));
  if (ev.fehler.length){
    body.append(h("span", {class:"cap", text:"Zum Üben"}));
    for (const f of ev.fehler) if (f && f.richtig) body.append(h("div", {class:"fix"},
      h("div", null, f.falsch ? [h("s", {text:f.falsch}), " → "] : null, h("b", {text:f.richtig})), f.warum ? h("div", {text:f.warum}) : null,
      h("div", {class:"actions"}, speakBtn("Anhören", f.richtig, true), saveBtn({bs:f.richtig, de:f.warum || "", laut:"", src:"Auswertung"}))));
  }
  if (ev.woerter.length){
    body.append(h("span", {class:"cap", text:"Wörter aus dem Gespräch"}));
    const list = h("div", {class:"list"});
    for (const w of ev.woerter) if (w && w.bs) list.append(h("div", {class:"li"},
      h("div", {class:"grow"}, h("b", {text:w.bs}), h("small", {text:w.de || ""}), w.laut ? h("small", {class:"laut", text:w.laut}) : null),
      speakBtn("Anhören", w.bs, false), saveBtn({...w, src:"Auswertung"})));
    body.append(list);
    body.append(h("button", {class:"btn sec", type:"button", text:"Alle ins Heft", onclick: (e) => {
      let n = 0; for (const w of ev.woerter) if (w && w.bs && addVocab({...w, src:"Auswertung"}, true)) n++;
      for (const f of ev.fehler) if (f && f.richtig && addVocab({bs:f.richtig, de:f.warum || "", laut:"", src:"Auswertung"}, true)) n++;
      toast(n ? `${n} Einträge ins Heft gelegt.` : "Alles steht schon im Heft."); e.target.disabled = true;
    }}));
  }
  body.append(h("div", {class:"row"},
    h("button", {class:"btn", type:"button", text:"Neues Gespräch, gleiches Thema", onclick: () => { closeSheet(); startConversation(c.scen, c.scen ? null : c.custom); }}),
    h("button", {class:"btn ghost", type:"button", text:"Schließen", onclick: closeSheet})));
}

function rateCard(it, r){

  else { it.box = Math.min(6, (it.box || 1) + 1); it.due = startOfDay(now) + BOX_DAYS[it.box] * DAY; CD.good++; }

  const c = new Set(), add = (x) => { if (x !== n && x >= lo && x <= hi) c.add(x); };

  if (n % 10 === 0 && n >= 20 && n <= 90) add(10 + n / 10);
  if (n >= 10 && n < 100) add((n % 10) * 10 + Math.floor(n / 10));
  [1, -1, 10, -10, 100, -100, 2, -2].forEach(d => add(n + d));

    let opts;
    if (src === "zahlen" && /^\d+$/.test(item.de)){
      const n = Number(item.de);

    if (!canSpeak() || answered) card.append(h("div", {class:"bs", text: word}));
  } else {
    card.append(h("span", {class:"cap", text: mode === "price" ? "Koliko košta? Sag den Preis" : "Sag die Zahl auf Bosnisch"}),
      h("div", {class:"bignum", text: mode === "price" ? `${n} KM` : String(n)}));
  }
  if (mode === "pick"){
    const opts = h("div", {class:"opts"});
    for (const o of NM.opts[NM.i]){
      const b = h("button", {class:"opt", type:"button", style:"font-variant-numeric:tabular-nums;font-size:1.5rem", text: String(o)});
      if (answered){ b.disabled = true; b.classList.add(o === n ? "right" : o === NM.picked ? "wrong" : "dim"); }
      else b.onclick = () => {
        NM.picked = o; NM.res[NM.i] = o === n ? 100 : 0; render();
        if (o === n){ const i = NM.i, my = NM; setTimeout(() => { if (NM === my && NM.phase === "run" && NM.i === i && view === "numbers") numNext(); }, 1200); }
      };
      opts.append(b);
    }
    card.append(opts);
    if (answered && NM.res[NM.i] === 0) card.append(h("div", {class:"row", style:"justify-content:center"}, speakBtn("Nochmal hören", word, true), h("button", {class:"btn", type:"button", text: NM.i < NM.qs.length - 1 ? "Weiter" : "Ergebnis", onclick: numNext})));
  } else if (!answered){
    const ab = answerBox((t, via) => {
      if (mode === "type"){ const got = Number((t.match(/\d+/g) || []).join("")); NM.res[NM.i] = got === n ? 100 : 0; NM.typed = t; }
      else { if (via === "mic") countSpoken(); NM.result = sayScore(n, t, word); NM.res[NM.i] = NM.result.score; }
      render();
      if (canSpeak() && mode !== "type") speak(word, false, null);
    }, mode === "type" ? {numeric:true, placeholder:"Zahl eingeben"} : {});
    card.append(ab.box);
    if (mode !== "type") card.append(h("button", {class:"tbtn", type:"button", text:"Lösung zeigen", onclick: () => { NM.res[NM.i] = 0; NM.result = null; render(); if (canSpeak()) speak(word, false, null); }}));
  } else {
    if (mode === "type"){
      const good = NM.res[NM.i] === 100;
      card.append(h("div", {class:"score " + (good ? "good" : "low"), text: good ? "Richtig" : `Nicht ${clip(NM.typed, 12)}`}), h("div", {class:"bignum", text: String(n)}));
    } else {
      if (NM.result) card.append(diffView(NM.result));
      card.append(h("div", {class:"bs", text: word}), h("div", {class:"laut", text: "≈ " + bsToLaut(word)}));
      if (NM.result && NM.result.viaDigits) card.append(h("p", {class:"muted small", text:"Die Erkennung hat Ziffern geschrieben. Die Zahl stimmt, die Aussprache der Endungen ließ sich so nicht prüfen."}));
      if (mode === "price") card.append(h("p", {class:"muted small", text:"Endung: auf 1 → jedna marka, auf 2–4 → marke (dvije, tri, četiri), sonst maraka. 11 bis 14 immer maraka."}));
    }
    card.append(h("div", {class:"row", style:"justify-content:center"}, speakBtn("Anhören", word, false), speakBtn("Langsam", word, true),
      mode !== "type" ? h("button", {class:"btn ghost", type:"button", text:"Nochmal", onclick: () => { delete NM.res[NM.i]; NM.result = null; render(); }}) : null,
      h("button", {class:"btn", type:"button", text: NM.i < NM.qs.length - 1 ? "Weiter" : "Ergebnis", onclick: numNext})));
  }
  main.append(card);
  if (listen && !answered && canSpeak() && NM.spoke !== NM.i){ NM.spoke = NM.i; setTimeout(() => speak(word, false, card.querySelector(".pill")), 150); }
};


/* ---------- export to the iPhone app ---------- */
function encodeExport(items){
  const bytes = new TextEncoder().encode(JSON.stringify({v:1, items}));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return "PRICAJ:" + btoa(bin);
}
function copyExport(items){
  const code = encodeExport(items);
  const ta = h("textarea", {class:"textin", rows:"4", readonly:"readonly", style:"font-size:.8rem;width:100%"}); ta.value = code;
  const body = h("div", {class:"stack"}, h("h2", {text:"Code für die iPhone-App"}),
    h("p", {class:"muted small", text:`${items.length} Einträge. In der iPhone-App: Heft → „Sätze aus der Claude-Version übernehmen“ → einfügen → Übernehmen.`}), ta,
    h("div", {class:"row"}, h("button", {class:"btn", type:"button", text:"Kopieren", onclick: () => {
      const fallback = () => { ta.focus(); ta.select(); toast("Text ist markiert: lange drücken und Kopieren wählen."); };
      try{ navigator.clipboard.writeText(code).then(() => toast("Code kopiert."), fallback); }catch(e){ fallback(); }
    }}), h("button", {class:"btn ghost", type:"button", text:"Schließen", onclick: closeSheet})));
  openSheet(body);
  try{ navigator.clipboard.writeText(code).then(() => toast("Code kopiert."), () => {}); }catch(e){}
}

        'Antworte nur mit JSON: {"saetze": [{"bs": "...", "de": "...", "laut": "..."}]}', {cache:false, modelTier:"default"});
      const items = (r && Array.isArray(r.saetze) ? r.saetze : []).filter(x => x && x.bs).slice(0, 14);
      if (!items.length) throw {code:"invalid_json"};

    }catch(e){ toast(sampleErrText(e && e.code)); }
    ABOUT.busy = false; if (view === "aboutme") render();
  };
  main.append(h("section", {class:"stack"}, h("label", {class:"cap", for:"aboutText", text:"Über dich"}), ta,
    h("button", {class:"btn", type:"button", text: ABOUT.busy ? "Claude schreibt …" : ABOUT.items ? "Neu erstellen" : "Sätze erstellen", disabled: ABOUT.busy, onclick: go_}),
    h("p", {class:"muted small", text:"Was du hier schreibst, bleibt in diesem Artifact bei dir. Die iPhone-App bekommt nur die fertigen Sätze, und auch nur, wenn du den Code dort einfügst."})));

    main.append(h("div", {class:"row"},

      h("button", {class:"btn ghost", type:"button", text:"Alle hier ins Heft", onclick: () => { let n = 0; for (const x of ABOUT.items) if (addVocab({...x, src:"Über mich"}, true)) n++; toast(n ? `${n} Sätze ins Heft gelegt.` : "Alles steht schon im Heft."); }})));
  }
};


/* ---------- import from the iPhone app (sentence code or full backup) ---------- */
function parsePhoneCode(code){
  const raw = String(code || "").replace(/\s+/g, "");
  const m = raw.match(/PRICAJ(-SICHERUNG)?:([A-Za-z0-9+/=_-]+)/);
  if (!m) throw new Error("Kein gültiger Code. Er beginnt mit PRICAJ: oder PRICAJ-SICHERUNG:");
  let data;
  try{
    const bin = atob(m[2].replace(/-/g, "+").replace(/_/g, "/")), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    data = JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ throw new Error("Der Code ist unvollständig. Bitte komplett kopieren."); }
  if (m[1]) return Object.values((data && data.data && data.data.vocab) || {});
  if (!data || !Array.isArray(data.items)) throw new Error("Der Code enthält keine Sätze.");
  return data.items;
}
function fromPhoneBox(){
  const ta = h("textarea", {class:"textin", rows:"3", placeholder:"Sicherung oder Code aus der iPhone-App einfügen", style:"resize:vertical;width:100%"});
  const file = h("input", {type:"file", accept:".txt,.json,text/plain,application/json", style:"display:none"});
  const run = (text) => {
    try{
      const items = parsePhoneCode(text); let added = 0, raised = 0;
      for (const it of items){
        if (!it || !it.bs) continue;
        let v = findVocab(it.bs);
        if (!v){ if (!addVocab({bs: it.bs, de: it.de || "", laut: it.laut || "", src: it.p || it.personal ? "Über mich" : "iPhone-App"}, true)) continue; v = findVocab(it.bs); added++; }
        if (v && it.box && it.box > (v.box || 1)){ v.box = it.box; v.due = it.due || v.due; v.upd = Date.now(); persistVocab(v.id); raised++; }
      }
      toast(added ? `${added} Einträge aus der iPhone-App übernommen.` : raised ? "Lernstand aus der iPhone-App übernommen." : "Alles war schon im Heft.");
      ta.value = ""; render();
    }catch(e){ toast(e.message || "Der Code ließ sich nicht lesen."); }
  };
  file.addEventListener("change", async () => { const f = file.files && file.files[0]; if (!f) return; try{ run(await f.text()); }catch(e){ toast("Die Datei ließ sich nicht lesen."); } file.value = ""; });
  return h("details", {class:"card"}, h("summary", {text:"Aus der iPhone-App übernehmen", style:"cursor:pointer;font-weight:600"}), h("div", {class:"stack", style:"margin-top:10px"},
    h("p", {class:"muted small", text:"In der iPhone-App unter Einstellungen → Sicherung eine Sicherung speichern oder als Code kopieren. Hier kommen nur die Heft-Einträge an, Lernpfad und Lerntage bleiben in der App."}),
    h("button", {class:"btn sec", type:"button", text:"Sicherungsdatei wählen", onclick: () => file.click()}), file,
    ta, h("button", {class:"btn", type:"button", text:"Übernehmen", onclick: () => run(ta.value)})));
}

  }
  if (!sheetEl) render();
})();
